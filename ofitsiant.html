<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>UNO Ofitsiant</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/waiter-192.png">
<link rel="manifest" href="ofitsiant.webmanifest">
<link rel="apple-touch-icon" href="icons/waiter-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="UNO Ofitsiant">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#0A0908; --card:#16140f; --line:#2c2617; --gold:#E8B04B; --text:#f4ead6; --muted:#9d927c; --red:#ff7a6b; --green:#7fd18a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(10,9,8,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header img { width: 40px; height: 40px; border-radius: 50%; }
  header .t { flex: 1; min-width: 0; }
  header b { display: block; font-size: 17px; letter-spacing: .14em; }
  header small { display: block; color: var(--gold); font-size: 11px; letter-spacing: .18em; margin-top: 2px; }
  .who { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { padding: 14px 14px 40px; max-width: 720px; margin: 0 auto; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(127,209,138,.15); }
  .dot.off { background: var(--red); box-shadow: 0 0 0 4px rgba(255,122,107,.15); }
  .banner { display: none; margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(232,176,75,.4); background: rgba(232,176,75,.08); color: var(--gold); font-size: 14px; line-height: 1.4; }
  .banner button { margin-top: 8px; }
  h2 { font-size: 13px; letter-spacing: .2em; color: var(--muted); margin: 22px 4px 10px; font-weight: 700; }
  .call { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; padding: 16px; margin-bottom: 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .call.new { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 30px rgba(232,176,75,.12); animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 40px rgba(232,176,75,.28); } }
  .num { grid-row: span 2; width: 74px; height: 74px; border-radius: 18px; background: #0f0d0a; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .num b { font-size: 30px; line-height: 1; color: var(--gold); }
  .num small { font-size: 10px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
  .what { font-size: 18px; font-weight: 700; }
  .what.bill { color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .items { grid-column: 1 / -1; margin: 4px 0 0; padding: 10px 12px; border-radius: 12px; background: #0f0d0a; font-size: 13px; color: #d8ccb2; line-height: 1.6; }
  .items .tot { display: flex; justify-content: space-between; margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--gold); font-weight: 700; }
  .acc { grid-column: 1 / -1; margin-top: 6px; height: 56px; border: 0; border-radius: 16px; background: var(--gold); color: #1a1306; font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .acc:active { transform: scale(.98); }
  .call.done { opacity: .6; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; font-size: 15px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .btn.gold { background: var(--gold); color: #1a1306; border-color: var(--gold); }
  dialog { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 20px; padding: 20px; width: min(360px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog input { width: 100%; margin: 12px 0 14px; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #0f0d0a; color: var(--text); font-size: 16px; }
  .login { max-width: 360px; margin: 8vh auto 0; text-align: center; }
  .login h1 { font-size: 22px; margin: 10px 0 6px; }
  .login p { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 0 18px; }
  .pinv { height: 58px; display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .pinv i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gold); }
  .pinv i.on { background: var(--gold); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { height: 64px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 24px; font-weight: 700; }
  .pad button:active { background: #221d13; }
  .pad .ok { background: var(--gold); color: #1a1306; border-color: var(--gold); font-size: 18px; }
  .lerr { color: var(--red); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
  .mine { margin: 0 0 14px; padding: 16px; border-radius: 20px; background: linear-gradient(160deg, #2a2112, #15120c); border: 1px solid rgba(232,176,75,.45); }
  .mine small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .18em; font-weight: 700; }
  .mine .z { font-size: 15px; color: var(--gold); font-weight: 800; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips b { min-width: 46px; padding: 10px 12px; border-radius: 12px; background: #0f0d0a; border: 1px solid var(--line); text-align: center; font-size: 18px; color: var(--text); }
  .mine .warn { margin-top: 10px; color: var(--red); font-size: 13px; line-height: 1.4; }
  .mine .note { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .tag { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; vertical-align: middle; }
  .tag.my { background: rgba(127,209,138,.15); color: var(--green); }
  .tag.all { background: rgba(232,176,75,.15); color: var(--gold); }
  .tag.oth { background: rgba(255,255,255,.08); color: var(--muted); }
  .more { width: 100%; margin: 4px 0 10px; padding: 13px; border-radius: 14px; border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <img src="media/logo.png" alt="" id="logo" style="-webkit-user-select:none;user-select:none;-webkit-touch-callout:none">
  <div class="t"><b>UNO</b><small>OFITSIANT</small></div>
  <button class="who" id="who" type="button" style="display:none">Chiqish</button>
</header>
<main>
  <div id="loginBox" class="login" style="display:none">
    <h1>Xush kelibsiz</h1>
    <p>Davomatdagi shaxsiy PIN-kodingizni kiriting. Bugungi stollaringiz rotatsiyadan o'zi biriktiriladi.</p>
    <div class="pinv" id="pinv"></div>
    <div class="pad" id="pad"></div>
    <div class="lerr" id="lerr"></div>
  </div>
  <div id="appBox" style="display:none">
    <div class="status"><span class="dot" id="dot"></span><span id="stat">Ulanmoqda…</span></div>
    <div class="banner" id="soundBanner">Chaqiruv kelganda ovoz chiqishi uchun bir marta bosing.<br><button class="btn gold" id="soundOn" type="button">Ovozni yoqish</button></div>
    <div id="mineBox"></div>
    <div id="newList"></div>
    <div id="otherBox"></div>
    <h2 id="doneH" style="display:none">QABUL QILINGAN</h2>
    <div id="doneList"></div>
  </div>
</main>
<script>
(function () {
  var SB_URL = "https://eaxavnixuqgwashplnhz.supabase.co", SB_KEY = "sb_publishable_gILXDU_L8vepyEbsF87Tcg_hYyMpril";
  var app = window.UnoWaiter || null;   // native app: it rings by itself
  var $ = function (id) { return document.getElementById(id); };
  var data = null, sb = null, busy = false, showOthers = false, pin = "";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm"; }
  function ago(ts) {
    var s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
    if (s < 60) return s + " soniya oldin";
    if (s < 3600) return Math.floor(s / 60) + " daqiqa oldin";
    return Math.floor(s / 3600) + " soat oldin";
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ""; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { return ""; } }
  function token() { return store("uno_waiter_token"); }
  function tellApp() { if (app && app.setToken) try { app.setToken(token() || ""); } catch (_) {} }

  /* ---- PIN login (the same PIN as Davomat) ---- */
  function pinDraw() {
    var h = ""; for (var i = 0; i < Math.max(4, pin.length); i++) h += '<i class="' + (i < pin.length ? "on" : "") + '"></i>';
    $("pinv").innerHTML = h;
  }
  $("pad").innerHTML = [1,2,3,4,5,6,7,8,9,"⌫",0,"Kirish"].map(function (k) { return '<button type="button" data-k="' + k + '"' + (k === "Kirish" ? ' class="ok"' : "") + '>' + k + '</button>'; }).join("");
  $("pad").addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]"); if (!b) return; var k = b.dataset.k; $("lerr").textContent = "";
    if (k === "⌫") pin = pin.slice(0, -1); else if (k === "Kirish") { login(); return; } else if (pin.length < 8) pin += k;
    pinDraw();
  });
  async function login() {
    if (pin.length < 3 || !sb) { $("lerr").textContent = "PIN-kodni kiriting."; return; }
    $("lerr").textContent = "Tekshirilmoqda…";
    var r = await sb.rpc("uno_waiter_login", { p_pin: pin });
    pin = ""; pinDraw();
    if (r.error) { $("lerr").textContent = /uno_waiter_login|function/.test(r.error.message) ? "Admin waiter.sql faylini Supabase'da ishga tushirishi kerak." : "Internet yo'q. Qayta urinib ko'ring."; return; }
    var d = r.data || {};
    if (!d.ok) { $("lerr").textContent = d.err === "locked" ? "Ko'p xato urinish. 10 daqiqadan keyin urinib ko'ring." : "PIN-kod noto'g'ri."; return; }
    store("uno_waiter_token", d.token); store("uno_waiter_name", d.name); tellApp();
    $("lerr").textContent = ""; show(); load(); afterLogin();
  }
  function show() {
    var on = !!token();
    $("loginBox").style.display = on ? "none" : "block";
    $("appBox").style.display = on ? "block" : "none";
    $("who").style.display = on ? "block" : "none";
    $("who").textContent = (store("uno_waiter_name") || "Ofitsiant") + " · Chiqish";
    if (!on) { pin = ""; pinDraw(); alarm(false); }
  }
  /* two taps to log out (system dialogs are not shown inside the Android app) */
  var outArm = 0;
  $("who").onclick = async function () {
    if (Date.now() - outArm > 3000) { outArm = Date.now(); $("who").textContent = "Chiqish uchun yana bosing"; setTimeout(function () { if (token()) $("who").textContent = (store("uno_waiter_name") || "Ofitsiant") + " · Chiqish"; }, 3000); return; }
    outArm = 0;
    var t = token(); store("uno_waiter_token", null); store("uno_waiter_name", null); data = null; tellApp(); show();
    if (sb && t) try { await sb.rpc("uno_waiter_logout", { p_token: t }); } catch (_) {}
  };

  /* ---- browser alarm (only when not inside the native app) ---- */
  var ctx = null, beepT = null;
  function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (_) {} $("soundBanner").style.display = "none"; }
  $("soundOn").onclick = unlock;
  if (!app) $("soundBanner").style.display = "block";
  function beep() {
    if (!ctx) return;
    var t = ctx.currentTime;
    [0, .22, .44].forEach(function (d, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = i === 2 ? 1320 : 988;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .18);
      o.connect(g); g.connect(ctx.destination); o.start(t + d); o.stop(t + d + .2);
    });
    try { navigator.vibrate && navigator.vibrate([400, 200, 400]); } catch (_) {}
  }
  function alarm(on) {
    if (app) return;
    if (on && !beepT) { beep(); beepT = setInterval(beep, 1600); }
    if (!on && beepT) { clearInterval(beepT); beepT = null; }
  }

  /* ---- today's tables from the rotation ---- */
  function mineHTML(me) {
    if (!me || me.unmapped) return '<div class="mine"><small>BUGUNGI STOLLARIM</small><div class="warn">Siz bugungi rotatsiyada topilmadingiz. Admin panel → Rotatsiya bo\'limida ismingiz xodimlar ro\'yxatiga bog\'langanini tekshirsin. Hozircha barcha chaqiruvlar sizga ham keladi.</div></div>';
    var t = me.tables || "", chips = t.split(",").map(function (x) { x = x.trim(); return x ? "<b>" + esc(x) + "</b>" : ""; }).join("");
    return '<div class="mine"><small>BUGUNGI STOLLARIM</small><div class="z">' + esc(me.zone || "") + ' · ' + esc(me.group || "") + '</div>' +
      (me.present === false ? '<div class="warn">Davomatda bugun kelganingiz belgilanmagan, shuning uchun stollaringiz boshqalarga bo\'lib berilgan. Eshikdagi telefonda PIN-kodingiz bilan belgilang.</div>' : '<div class="chips">' + chips + '</div>') +
      '<div class="note">' + (me.final ? "Davomat bo'yicha yakuniy taqsimot (18:00)." : "Asosiy reja. 18:00 da davomat bo'yicha yangilanadi.") + ' Sizning stollaringizdan kelgan chaqiruvlar faqat sizda jiringlaydi; hech kimga biriktirilmagan stollar chaqiruvi hammaga keladi.</div></div>';
  }

  function render() {
    if (!data) return;
    var list = data.calls || [];
    var fresh = list.filter(function (c) { return c.status === "new"; }).sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    var unm = !data.me || data.me.unmapped;
    var mine = fresh.filter(function (c) { return unm || c.mine || c.common; }), other = fresh.filter(function (c) { return !(unm || c.mine || c.common); });
    var done = list.filter(function (c) { return c.status !== "new" && Date.now() - new Date(c.accepted_at || c.created_at).getTime() < 3600e3 && (c.mine || c.common || c.accepted_by === data.name); })
                   .sort(function (a, b) { return new Date(b.accepted_at || b.created_at) - new Date(a.accepted_at || a.created_at); }).slice(0, 20);
    $("mineBox").innerHTML = mineHTML(data.me);
    $("newList").innerHTML = mine.map(function (c) { return card(c, true); }).join("") || '<div class="empty">Stollaringizdan chaqiruv yo\'q.<br>Yangi chaqiruv kelganda telefon jiringlaydi.</div>';
    $("otherBox").innerHTML = other.length ? '<button class="more" type="button" id="othBtn">' + (showOthers ? "▴ Boshqa ofitsiantlar stollarini yashirish" : "▾ Boshqa ofitsiantlar stollari: " + other.length + " ta chaqiruv") + '</button>' + (showOthers ? other.map(function (c) { return card(c, true); }).join("") : "") : "";
    $("doneH").style.display = done.length ? "block" : "none";
    $("doneList").innerHTML = done.map(function (c) { return card(c, false); }).join("");
    alarm(mine.length > 0);
    document.title = (mine.length ? "(" + mine.length + ") " : "") + "UNO Ofitsiant";
  }
  function card(c, isNew) {
    var bill = c.kind === "bill";
    var tag = c.mine ? '<span class="tag my">meniki</span>' : c.common ? '<span class="tag all">umumiy</span>' : '<span class="tag oth">' + esc((c.owners || []).join(", ")) + '</span>';
    var h = '<div class="call ' + (isNew ? "new" : "done") + '"' + (isNew && !c.mine && !c.common && data.me && !data.me.unmapped ? ' style="animation:none;opacity:.85"' : "") + '>' +
      '<div class="num"><b>' + esc(String(c.table_no).replace(/^[^0-9]*\s/, "")) + '</b><small>' + esc((String(c.table_no).match(/^[^0-9]+/) || ["STOL"])[0].trim().slice(0, 9).toUpperCase() || "STOL") + '</small></div>' +
      '<div class="what' + (bill ? " bill" : "") + '">' + (bill ? "Hisob so'rayapti" : "Ofitsiant chaqiryapti") + tag + '</div>' +
      '<div class="meta">' + esc(c.table_no) + '-stol · ' + ago(c.created_at) + (isNew ? "" : " · " + esc(c.accepted_by || "") + " qabul qildi") + '</div>';
    if (bill && (c.items || c.total)) {
      h += '<div class="items">';
      (c.items || []).forEach(function (it) { h += esc(it.n) + " × " + esc(it.q) + "<br>"; });
      if (c.total) h += '<div class="tot"><span>Jami (xizmat haqi bilan)</span><span>' + money(c.total) + '</span></div>';
      h += '</div>';
    }
    if (isNew) h += '<button class="acc" type="button" data-id="' + c.id + '">Qabul qildim</button>';
    return h + '</div>';
  }

  $("appBox").addEventListener("click", async function (e) {
    if (e.target.id === "othBtn") { showOthers = !showOthers; render(); return; }
    var b = e.target.closest("[data-id]"); if (!b || !sb) return;
    var id = Number(b.dataset.id); b.disabled = true; b.textContent = "…";
    var r = await sb.rpc("uno_waiter_accept", { p_token: token(), p_id: id });
    if (r.error || !r.data || !r.data.ok) { if (r.data && r.data.err === "logged_out") { store("uno_waiter_token", null); show(); return; } b.disabled = false; b.textContent = "Qayta urinib ko'ring"; return; }
    (data.calls || []).forEach(function (c) { if (c.id === id && c.status === "new") { c.status = "accepted"; c.accepted_by = data.name; c.accepted_at = new Date().toISOString(); } });
    render(); load();
    if (app) try { app.poll(); } catch (_) {}
  });

  function online(ok, text) { $("dot").classList.toggle("off", !ok); $("stat").textContent = text; }
  async function load() {
    if (!sb || !token() || busy) return; busy = true;
    try {
      var r = await sb.rpc("uno_waiter_calls", { p_token: token() });
      if (r.error) { online(false, "Bazaga ulanib bo'lmadi: " + r.error.message); return; }
      if (!r.data || !r.data.ok) { store("uno_waiter_token", null); tellApp(); show(); $("lerr").textContent = "Qaytadan kiring."; return; }
      data = r.data; store("uno_waiter_name", data.name); $("who").textContent = data.name + " · Chiqish";
      online(true, "Ulangan · " + new Date().toLocaleTimeString("uz", { hour: "2-digit", minute: "2-digit" }));
      render();
    } finally { busy = false; }
  }

  /* hidden admin entry (waiter-phone mode is switched off there): hold the logo 3 s or tap it 7 times */
  (function () {
    var lg = $("logo"), holdT = null, taps = 0, tapT = null;
    function open() { clearTimeout(holdT); taps = 0; location.href = "index.html#admin"; }
    function down(e) { if (e.cancelable) e.preventDefault(); clearTimeout(holdT); holdT = setTimeout(open, 3000); taps++; clearTimeout(tapT); tapT = setTimeout(function () { taps = 0; }, 1500); if (taps >= 7) open(); }
    function up() { clearTimeout(holdT); }
    lg.addEventListener("touchstart", down, { passive: false }); lg.addEventListener("touchend", up); lg.addEventListener("touchcancel", up);
    lg.addEventListener("mousedown", function (e) { if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return; down(e); }); lg.addEventListener("mouseup", up); lg.addEventListener("mouseleave", up);
    lg.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();
  /* in the UNO menu app the bridge is UnoKiosk: there the phone rings only while this screen is open */
  if (!app && window.UnoKiosk) $("soundBanner").innerHTML = 'Chaqiruv kelganda telefon jiringlashi uchun ovozni yoqing va shu ekranni ochiq qoldiring.<br><button class="btn gold" id="soundOn2" type="button">Ovozni yoqish</button>';
  document.addEventListener("click", function (e) { if (e.target && e.target.id === "soundOn2") unlock(); });
  show(); pinDraw();
  if (!window.supabase) { online(false, "Internetga ulanib bo'lmadi"); setTimeout(function () { location.reload(); }, 15000); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  tellApp();

  /* opened from the Telegram "Qabul qildim" button: ofitsiant.html?accept=ID */
  var acceptId = Number(new URLSearchParams(location.search).get("accept") || 0);
  function afterLogin() {
    if (!acceptId) return; var id = acceptId; acceptId = 0;
    var box = document.createElement("div"); box.className = "call new"; box.style.marginBottom = "18px";
    box.innerHTML = '<div class="what" style="grid-column:1/-1">Qabul qilinmoqda…</div>';
    $("mineBox").parentNode.insertBefore(box, $("mineBox"));
    sb.rpc("uno_waiter_accept", { p_token: token(), p_id: id }).then(function (r) {
      var ok = r.data && r.data.ok;
      box.className = "call done"; box.style.opacity = "1";
      box.innerHTML = '<div class="what" style="grid-column:1/-1;color:' + (ok && r.data.accepted ? "var(--green)" : "var(--muted)") + '">' + (ok ? (r.data.accepted ? "✅ Chaqiruvni qabul qildingiz" : "Bu chaqiruv allaqachon qabul qilingan") : "Xatolik. Qayta urinib ko'ring.") + '</div>';
      try { history.replaceState(null, "", location.pathname); } catch (_) {}
      load();
    });
  }
  if (token()) afterLogin();
  sb.channel("calls").on("postgres_changes", { event: "*", schema: "public", table: "uno_calls" }, function () { load(); })
    .subscribe(function (st) { if (st === "SUBSCRIBED") load(); });
  load();
  setInterval(load, 15000);
  setInterval(render, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
