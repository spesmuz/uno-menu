<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>UNO Ofitsiant</title>
<link rel="icon" href="media/logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#0A0908; --card:#16140f; --line:#2c2617; --gold:#E8B04B; --text:#f4ead6; --muted:#9d927c; --red:#ff7a6b; --green:#7fd18a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(10,9,8,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header img { width: 40px; height: 40px; border-radius: 50%; }
  header .t { flex: 1; min-width: 0; }
  header b { display: block; font-size: 17px; letter-spacing: .14em; }
  header small { display: block; color: var(--gold); font-size: 11px; letter-spacing: .18em; margin-top: 2px; }
  .who { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { padding: 14px 14px 40px; max-width: 720px; margin: 0 auto; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(127,209,138,.15); }
  .dot.off { background: var(--red); box-shadow: 0 0 0 4px rgba(255,122,107,.15); }
  .banner { display: none; margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(232,176,75,.4); background: rgba(232,176,75,.08); color: var(--gold); font-size: 14px; line-height: 1.4; }
  .banner button { margin-top: 8px; }
  h2 { font-size: 13px; letter-spacing: .2em; color: var(--muted); margin: 22px 4px 10px; font-weight: 700; }
  .call { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; padding: 16px; margin-bottom: 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .call.new { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 30px rgba(232,176,75,.12); animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 40px rgba(232,176,75,.28); } }
  .num { grid-row: span 2; width: 74px; height: 74px; border-radius: 18px; background: #0f0d0a; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .num b { font-size: 30px; line-height: 1; color: var(--gold); }
  .num small { font-size: 10px; letter-spacing: .2em; color: var(--muted); margin-top: 4px; }
  .what { font-size: 18px; font-weight: 700; }
  .what.bill { color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .items { grid-column: 1 / -1; margin: 4px 0 0; padding: 10px 12px; border-radius: 12px; background: #0f0d0a; font-size: 13px; color: #d8ccb2; line-height: 1.6; }
  .items .tot { display: flex; justify-content: space-between; margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--gold); font-weight: 700; }
  .acc { grid-column: 1 / -1; margin-top: 6px; height: 56px; border: 0; border-radius: 16px; background: var(--gold); color: #1a1306; font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .acc:active { transform: scale(.98); }
  .call.done { opacity: .6; }
  .empty { text-align: center; color: var(--muted); padding: 50px 10px; font-size: 15px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .btn.gold { background: var(--gold); color: #1a1306; border-color: var(--gold); }
  dialog { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 20px; padding: 20px; width: min(360px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog input { width: 100%; margin: 12px 0 14px; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #0f0d0a; color: var(--text); font-size: 16px; }
</style>
</head>
<body>
<header>
  <img src="media/logo.png" alt="">
  <div class="t"><b>UNO</b><small>OFITSIANT</small></div>
  <button class="who" id="who" type="button">Ism</button>
</header>
<main>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">Ulanmoqda…</span></div>
  <div class="banner" id="soundBanner">Brauzerda chaqiruv kelganda ovoz chiqishi uchun bir marta bosing.<br><button class="btn gold" id="soundOn" type="button">Ovozni yoqish</button></div>
  <div id="newList"></div>
  <h2 id="doneH" style="display:none">QABUL QILINGAN</h2>
  <div id="doneList"></div>
</main>
<dialog id="nameDlg">
  <b style="font-size:17px">Ismingiz</b>
  <div style="color:var(--muted);font-size:13px;margin-top:4px">Chaqiruvni kim qabul qilgani boshqa ofitsiantlarga va mijozga ko'rinadi.</div>
  <input id="nameIn" maxlength="30" placeholder="Masalan: Aziz" autocomplete="name">
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn gold" id="nameOk" type="button">Saqlash</button></div>
</dialog>
<script>
(function () {
  var SB_URL = "https://eaxavnixuqgwashplnhz.supabase.co", SB_KEY = "sb_publishable_gILXDU_L8vepyEbsF87Tcg_hYyMpril";
  var app = window.UnoWaiter || null;   // native app: it rings by itself
  var $ = function (id) { return document.getElementById(id); };
  var calls = {}, sb = null, tick = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function money(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm"; }
  function ago(ts) {
    var s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
    if (s < 60) return s + " soniya oldin";
    if (s < 3600) return Math.floor(s / 60) + " daqiqa oldin";
    return Math.floor(s / 3600) + " soat oldin";
  }
  function name() { try { return localStorage.getItem("uno_waiter_name") || ""; } catch (_) { return ""; } }
  function askName() { $("nameIn").value = name(); try { $("nameDlg").showModal(); } catch (_) { var v = prompt("Ismingiz", name()); if (v != null) saveName(v); } }
  function saveName(v) { v = String(v || "").trim().slice(0, 30); try { localStorage.setItem("uno_waiter_name", v); } catch (_) {} $("who").textContent = v || "Ism"; }
  $("who").onclick = askName;
  $("nameOk").onclick = function () { saveName($("nameIn").value); $("nameDlg").close(); };
  saveName(name());
  if (!name()) setTimeout(askName, 400);

  /* ---- browser alarm (only when not inside the native app) ---- */
  var ctx = null, beepT = null;
  function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (_) {} $("soundBanner").style.display = "none"; }
  $("soundOn").onclick = unlock;
  if (!app) $("soundBanner").style.display = "block";
  function beep() {
    if (!ctx) return;
    var t = ctx.currentTime;
    [0, .22, .44].forEach(function (d, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = i === 2 ? 1320 : 988;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.35, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .18);
      o.connect(g); g.connect(ctx.destination); o.start(t + d); o.stop(t + d + .2);
    });
    try { navigator.vibrate && navigator.vibrate([400, 200, 400]); } catch (_) {}
  }
  function alarm(on) {
    if (app) return;
    if (on && !beepT) { beep(); beepT = setInterval(beep, 1600); }
    if (!on && beepT) { clearInterval(beepT); beepT = null; }
  }

  function render() {
    var list = Object.keys(calls).map(function (k) { return calls[k]; });
    var fresh = list.filter(function (c) { return c.status === "new"; }).sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); });
    var done = list.filter(function (c) { return c.status !== "new" && Date.now() - new Date(c.accepted_at || c.created_at).getTime() < 3600e3; })
                   .sort(function (a, b) { return new Date(b.accepted_at || b.created_at) - new Date(a.accepted_at || a.created_at); }).slice(0, 20);
    var h = "";
    fresh.forEach(function (c) { h += card(c, true); });
    $("newList").innerHTML = h || '<div class="empty">Hozircha chaqiruv yo\'q.<br>Yangi chaqiruv kelganda telefon jiringlaydi.</div>';
    $("doneH").style.display = done.length ? "block" : "none";
    $("doneList").innerHTML = done.map(function (c) { return card(c, false); }).join("");
    alarm(fresh.length > 0);
    document.title = (fresh.length ? "(" + fresh.length + ") " : "") + "UNO Ofitsiant";
  }
  function card(c, isNew) {
    var bill = c.kind === "bill";
    var h = '<div class="call ' + (isNew ? "new" : "done") + '">' +
      '<div class="num"><b>' + esc(c.table_no) + '</b><small>STOL</small></div>' +
      '<div class="what' + (bill ? " bill" : "") + '">' + (bill ? "Hisob so'rayapti" : "Ofitsiant chaqiryapti") + '</div>' +
      '<div class="meta">' + ago(c.created_at) + (isNew ? "" : " · " + esc(c.accepted_by || "") + " qabul qildi") + '</div>';
    if (bill && (c.items || c.total)) {
      h += '<div class="items">';
      (c.items || []).forEach(function (it) { h += esc(it.n) + " × " + esc(it.q) + "<br>"; });
      if (c.total) h += '<div class="tot"><span>Jami (xizmat haqi bilan)</span><span>' + money(c.total) + '</span></div>';
      h += '</div>';
    }
    if (isNew) h += '<button class="acc" type="button" data-id="' + c.id + '">Qabul qildim</button>';
    return h + '</div>';
  }

  $("newList").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-id]"); if (!b || !sb) return;
    if (!name()) { askName(); return; }
    var id = Number(b.dataset.id); b.disabled = true; b.textContent = "…";
    var r = await sb.rpc("uno_accept_call", { p_id: id, p_by: name() });
    if (r.error) { b.disabled = false; b.textContent = "Qayta urinib ko'ring"; return; }
    if (calls[id]) { calls[id].status = "accepted"; calls[id].accepted_by = name(); calls[id].accepted_at = new Date().toISOString(); }
    render();
    if (app) try { app.poll(); } catch (_) {}
  });

  function online(ok, text) { $("dot").classList.toggle("off", !ok); $("stat").textContent = text; }
  async function load() {
    if (!sb) return;
    var since = new Date(Date.now() - 12 * 3600e3).toISOString();
    var r = await sb.from("uno_calls").select("*").gt("created_at", since).order("created_at", { ascending: false }).limit(100);
    if (r.error) { online(false, "Bazaga ulanib bo'lmadi: " + r.error.message); return; }
    var n = {}; (r.data || []).forEach(function (c) { n[c.id] = c; }); calls = n;
    online(true, "Ulangan · " + new Date().toLocaleTimeString("uz", { hour: "2-digit", minute: "2-digit" }));
    render();
  }

  if (!window.supabase) { online(false, "Internetga ulanib bo'lmadi"); setTimeout(function () { location.reload(); }, 15000); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
  sb.channel("calls").on("postgres_changes", { event: "*", schema: "public", table: "uno_calls" }, function (pl) {
    if (pl.new && pl.new.id) calls[pl.new.id] = pl.new;
    render();
  }).subscribe(function (st) { if (st === "SUBSCRIBED") load(); });
  load();
  setInterval(load, 15000);
  setInterval(render, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
