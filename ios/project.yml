# UNO Airways — iPhone ilovasi (XcodeGen loyihasi). Yig'ish: .github/workflows/ios.yml
name: UNOAirways
options:
  bundleIdPrefix: uz.uno
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.2.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  UNOAirways:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: UNO Airways
        CFBundleName: UNO Airways
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, uz]
        LSApplicationQueriesSchemes: [instagram, tg, tel]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "The microphone is used only when you speak to the UNO AI assistant."
        NSLocationWhenInUseUsageDescription: "Your location is used only to fill in the delivery address for your order."
        NSCameraUsageDescription: "The camera is used only to take a photo of a dish or for your profile picture."
        UILaunchScreen:
          UIColorName: LaunchBg
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        WKAppBoundDomains: [spesmuz.github.io]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.uno.airways
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    scheme:
      testTargets: [UNOAirwaysUITests]
  UNOAirwaysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: UNOAirways
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.uno.airways.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
