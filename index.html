<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>UNO Airways Restaurante</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/menu-192.png">
<link rel="apple-touch-icon" href="icons/menu-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNO Menyu">
<meta name="theme-color" content="#0E0F12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--gold:#E8B04B;--gold2:#F3C873;--ink:#0E0F12;--panel:#17181C;--card:#1E2026;--line:rgba(255,255,255,.10);--text:#F3EFE7;--muted:#A39E94;--spd:.7s}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E0F12;color:var(--text);font-family:Manrope,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mont{font-family:Montserrat,sans-serif}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#1A1C21;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon-btn:hover{border-color:rgba(232,176,75,.5)}
.icon-btn svg{width:19px;height:19px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- MENU ---------- */
#menuView{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 110% 46% at 50% 26%,rgba(232,176,75,.09),rgba(232,176,75,0) 70%),var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;transform-origin:50% 50%;overflow:hidden;
  background:transparent;padding:22px 32px 66px;display:flex;flex-direction:column;gap:14px}
.m-head{display:flex;align-items:center;gap:14px;height:60px;position:relative;z-index:300}
.logo{display:flex;align-items:center;gap:10px;min-width:150px;max-width:250px;flex:0 0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.logo img{width:58px;height:58px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(232,176,75,.25))}
.logo .lt{display:flex;flex-direction:column;gap:3px;min-width:0}
.logo b{font-family:Montserrat;font-size:24px;font-weight:600;letter-spacing:.16em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{font-size:9px;font-weight:700;letter-spacing:.32em;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.logo-pv{width:120px;height:120px;border-radius:16px;background:#0F1013;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;flex:0 0 auto}
.logo-pv img{max-width:100%;max-height:100%;object-fit:contain}
.tabs-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.tabs{display:flex;gap:4px;padding:4px;border-radius:26px;background:#1A1C21;border:1px solid var(--line);max-width:100%;overflow-x:auto;scroll-behavior:auto}
.tabs.fade-r{-webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 46px),rgba(0,0,0,.15) 100%);mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 46px),rgba(0,0,0,.15) 100%)}
.tabs.fade-l{-webkit-mask-image:linear-gradient(to right,rgba(0,0,0,.15) 0,#000 46px,#000 100%);mask-image:linear-gradient(to right,rgba(0,0,0,.15) 0,#000 46px,#000 100%)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,rgba(0,0,0,.15) 0,#000 46px,#000 calc(100% - 46px),rgba(0,0,0,.15) 100%);mask-image:linear-gradient(to right,rgba(0,0,0,.15) 0,#000 46px,#000 calc(100% - 46px),rgba(0,0,0,.15) 100%)}
.tab{height:40px;padding:0 13px;border-radius:20px;border:0;background:transparent;color:#C9C3B8;font-family:Montserrat;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background .35s,color .35s,box-shadow .35s}
.tabs.tight .tab{padding:0 9px;font-size:11px;letter-spacing:.04em}
.tabs.tighter .tab{padding:0 7px;font-size:10.5px;letter-spacing:.02em}
.tab[aria-pressed="true"]{background:var(--gold);color:#17130A;box-shadow:0 4px 18px rgba(232,176,75,.35)}
.search-box{display:flex;align-items:center;gap:10px;width:100%;max-width:480px;height:48px;padding:0 6px 0 18px;border-radius:24px;background:#1A1C21;border:1px solid var(--gold);color:var(--muted)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}
.cart-btn{height:48px;flex:0 0 auto;padding:0 16px 0 12px;border-radius:24px;border:1px solid var(--line);background:#1A1C21;display:flex;align-items:center;gap:10px}
.cart-btn .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.cart-btn .t b{font-size:15px;font-weight:800}.cart-btn .t small{font-size:11px;color:var(--muted)}

#carousel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#track{flex:1;min-height:0;position:relative;touch-action:none;user-select:none;cursor:grab;perspective:1400px;perspective-origin:50% 45%}
#track.dragging{cursor:grabbing}
.slide{position:absolute;top:var(--cardTop,0px);left:50%;width:var(--cardW,500px);height:var(--cardH,100%);margin-left:calc(var(--cardW,500px) / -2);will-change:transform,opacity;
  transition:transform var(--spd) cubic-bezier(.25,1.12,.4,1),opacity calc(var(--spd)*.7) cubic-bezier(.22,1,.36,1),filter calc(var(--spd)*.8) cubic-bezier(.22,1,.36,1)}
#track.dragging .slide,.slide.nojump{transition:none!important}
.slide .glow{position:absolute;inset:0;border-radius:28px;box-shadow:0 0 0 4px rgba(232,176,75,.07),0 24px 80px rgba(232,176,75,.22);opacity:0;transition:opacity var(--spd)}
.slide.center .glow{opacity:1}
.card{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:28px;background:linear-gradient(180deg,#2A2C33,#1B1D22);border:1px solid rgba(255,255,255,.08);transition:border-color .5s}
.slide.center .card{border-color:rgba(232,176,75,.5)}
.card{transition:border-color .5s,transform .55s cubic-bezier(.2,.9,.3,1.25);transform-origin:50% 50%;--gx:50%;--gy:50%;--go:0;--px:0px;--py:0px}
.card.tilting{transition:border-color .5s,transform .09s linear}
.card::after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;z-index:8;opacity:var(--go);transition:opacity .45s;
  background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,226,170,.26),rgba(255,226,170,.08) 28%,rgba(255,226,170,0) 55%);mix-blend-mode:screen}
.card.tilting::after{transition:opacity .12s}
.slide.center .media .thumb,.slide.center .media .vidwrap{transform:none}
.media{flex:0 0 auto;height:calc(var(--cardW,500px) - 28px);min-height:0;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#34363E,#1F2126);position:relative;display:flex;align-items:center;justify-content:center}
.media>button.sel{position:absolute;inset:0;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
.media .thumb{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));opacity:0;transition:opacity .25s}
.media .thumb.ready{opacity:1}
.slide.center .media .thumb{max-width:94%;max-height:94%}
.media .thumb.cover,.slide.center .media .thumb.cover{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:none}
.plate{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#2A2A2E 0 60%,#121214 62% 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08)}
.plate i{width:142px;height:142px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E6B566,#A9682C)}
.badge{position:absolute;top:14px;z-index:6;height:26px;padding:0 12px;border-radius:13px;background:rgba(14,15,18,.72);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;z-index:6}
.badge.cat{left:14px;color:var(--gold)}
.badge.kc{top:auto;bottom:14px;left:14px;color:var(--text);text-transform:none;letter-spacing:.02em}
.badge.kc svg{color:var(--gold)}.badge.vid{right:14px;color:var(--text)}
.badge.vid i{width:7px;height:7px;border-radius:4px;background:#E5484D}
.badge.rt{top:auto;bottom:14px;left:14px;color:var(--text);text-transform:none;letter-spacing:.02em;pointer-events:none;gap:5px}
.badge.rt svg{color:var(--gold);width:13px;height:13px}.badge.rt small{color:var(--muted);font-weight:600;font-size:11px}
.stars{position:relative;display:inline-block;line-height:1;letter-spacing:2px;font-size:17px;white-space:nowrap}
.stars .s-bg{color:rgba(255,255,255,.16)}.stars .s-fg{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold)}
.stars.sm{font-size:12px;letter-spacing:1px}
.d-rev{border-top:1px solid var(--line);margin-top:4px;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.rv-cap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.rv-sum{display:flex;align-items:center;gap:10px;margin-top:6px}.rv-sum b{font-size:30px;font-weight:800;line-height:1}.rv-sum span{color:var(--muted);font-size:13px}
.rv-none{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.rv-my{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rv-pick{display:flex;gap:6px}
.rv-pick button{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:rgba(255,255,255,.22);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,color .2s,background .2s,border-color .2s}
.rv-pick button.on{color:var(--gold);border-color:rgba(232,176,75,.55);background:rgba(232,176,75,.12)}
.rv-pick button:active{transform:scale(.86)}.rv-pick svg{width:22px;height:22px}
.rv-form{display:flex;flex-direction:column;gap:8px;animation:fadeUp .35s both}
.rv-form input,.rv-form textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;color:var(--text);font:inherit;font-size:16px;padding:11px 13px;resize:none;outline:0}
.rv-form input:focus,.rv-form textarea:focus{border-color:rgba(232,176,75,.6)}
.rv-send{align-self:flex-end;height:44px;padding:0 22px;border-radius:22px;border:0;background:var(--gold);color:#17130A;font-size:14px;font-weight:800;cursor:pointer}
.rv-send:disabled{opacity:.55}
.rv-msg{font-size:13px;color:var(--gold2);line-height:1.4}.rv-msg:empty{display:none}.rv-msg.err{color:#ff8f8f}
.rv-list{display:flex;flex-direction:column;gap:8px}
.rv-item{padding:11px 13px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.rv-item.mine{border-color:rgba(232,176,75,.35)}
.rv-dots{margin-left:6px;width:30px;height:26px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
.rv-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rv-acts button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;font-size:13px;cursor:pointer}
.rv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rv-top b{font-size:14px}.rv-top time{margin-left:auto;font-size:12px;color:var(--muted)}
.rv-item p{margin:6px 0 0;font-size:14px;line-height:1.45;opacity:.9;white-space:pre-wrap;word-break:break-word}
.rv-more{align-self:center;height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.rv-load{color:var(--muted);font-size:13px;margin:0}
.info{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 6px;height:34px;flex:0 0 auto}
.info h2{margin:0;font-family:Montserrat;font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block!important;min-width:0}
.info .price{flex:0 0 auto;font-size:20px;font-weight:800;color:var(--gold)}
.desc{margin:0;padding:0 6px;font-size:14px;line-height:1.5;color:#BDB7AC;height:42px;flex:0 0 auto;-webkit-line-clamp:2!important}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;height:44px;flex:0 0 auto}
.more-btn{height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:#23252B;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.more-btn:hover{border-color:rgba(232,176,75,.5)}
.more-btn.kc{border-color:rgba(232,176,75,.45);white-space:nowrap}.more-btn.kc svg{color:var(--gold)}.more-btn.kc .kc-v{color:#fff}
.media>button.sel.open{z-index:7;cursor:zoom-in}
.langs{display:flex;gap:2px;padding:3px;border-radius:22px;background:#1A1C21;border:1px solid var(--line)}
.langs.float{position:absolute;right:32px;bottom:17px;z-index:260;background:rgba(26,28,33,.92);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.langs button{height:36px;min-width:42px;padding:0 8px;border-radius:18px;border:0;background:transparent;color:#C9C3B8;font-size:12px;font-weight:800;letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--gold);color:#17130A}
.detail{position:absolute;inset:0;z-index:450;background:#0A0908;display:flex;align-items:stretch;padding:30px 34px;gap:30px;animation:fadeIn .3s both}
.d-media{flex:1.45;min-width:0;border-radius:30px;overflow:hidden;position:relative;background:radial-gradient(ellipse 90% 70% at 50% 62%,#4A311A 0%,#1B130D 55%,#0B0908 85%);border:1px solid rgba(232,176,75,.4);box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(232,176,75,.12);display:flex;align-items:center;justify-content:center;animation:zoomIn .5s cubic-bezier(.2,.9,.25,1) both;touch-action:pan-y}
.d-media .d-glow{position:absolute;left:50%;bottom:8%;width:70%;height:22%;margin-left:-35%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,180,90,.35),transparent 70%)}
.d-media img.big{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 34px 44px rgba(0,0,0,.65));opacity:0;transition:opacity .25s}
.d-media img.big.ready{opacity:1}
.d-media img.big.cover{inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.d-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.011;transition:opacity .6s ease;z-index:2;background:#111}
.d-media video.show{opacity:1}
.d-sound{opacity:0;pointer-events:none;transition:opacity .4s}
.d-layer.has-vid .d-sound{opacity:1;pointer-events:auto}
.d-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .42s ease,transform .48s cubic-bezier(.2,.9,.3,1);will-change:transform,opacity}
.d-layer.leaving{pointer-events:none}
.d-info{transition:opacity .16s ease;touch-action:pan-y}
.d-info.fading{opacity:0}
.d-media .arrow{z-index:5}.d-media .arrow.l{left:16px}.d-media .arrow.r{right:16px}
.d-sound{position:absolute;left:18px;bottom:18px;z-index:5;height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(14,15,18,.7);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.d-sound.on{background:var(--gold);color:#17130A;border-color:var(--gold)}
.d-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:46px 4px 6px;overflow-y:auto;animation:fadeUp .5s .1s both}
.d-cat{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.d-name{margin:0;font-family:Montserrat;font-size:34px;font-weight:800;line-height:1.1;text-transform:uppercase}
.d-price{font-size:28px;font-weight:800;color:var(--gold)}
.d-desc{margin:0;font-size:16px;line-height:1.55;color:#D6D0C6}
.d-ingr{padding:14px 16px;border-radius:16px;background:#1A1C21;border:1px solid var(--line)}
.d-ingr small,.fact small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.d-ingr p{margin:0;font-size:14px;line-height:1.55;color:#E6E0D6}
.d-facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{padding:12px 16px;border-radius:14px;background:#1A1C21;border:1px solid var(--line);min-width:130px}
.fact b{font-size:17px}
.fact.kcal{border-color:rgba(232,176,75,.45)}
.fact.kcal b{color:var(--gold)}
.fact.macros{display:flex;gap:18px}
.fact.macros small{margin-bottom:4px}
.d-act{margin-top:auto;display:flex;justify-content:flex-start}
.d-act .add-btn{height:54px;padding:0 26px;font-size:16px;border-radius:27px}
.d-close{position:absolute;top:24px;right:28px;z-index:6;width:48px;height:48px;border-radius:24px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.catrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto auto;gap:8px;align-items:center;margin-bottom:8px}
.catrow input{height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#1F2126;color:var(--text);font-size:14px;min-width:0}
.ltabs{display:flex;gap:6px}
.ltabs button{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#23252B;font-size:13px;font-weight:700}
.ltabs button[aria-selected="true"]{background:var(--gold);color:#17130A;border-color:var(--gold)}
.lsec{display:flex;flex-direction:column;gap:12px}
.aitab{width:100%;border-collapse:collapse;font-size:13px}
.aitab th,.aitab td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.aitab th:first-child,.aitab td:first-child{text-align:left;white-space:normal}
.aitab th{color:var(--muted);font-weight:700;font-size:12px}
.aitab tfoot td{font-weight:800;color:var(--gold2);border-bottom:0}
.aitab.rep{font-size:14px;border-radius:14px;overflow:hidden;table-layout:fixed;width:100%}.aitab.rep th:first-child,.aitab.rep td:first-child{width:34%}
.aitab.rep th{background:rgba(232,176,75,.14);color:var(--gold2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:10px;white-space:normal}
.aitab.rep td{padding:10px 8px;text-align:left;white-space:normal}.aitab.rep th{text-align:left;padding:10px 8px}
.aitab.rep tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.aitab.rep td.money{color:#FF7A70;font-weight:800;font-variant-numeric:tabular-nums}
.aitab.rep td.num{font-variant-numeric:tabular-nums}
.aitab.rep td .s{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px}
.aitab.rep tr.day td{background:rgba(232,176,75,.08)!important;color:var(--gold2);font-weight:800;font-size:13px;padding:8px 10px}
.aitab.rep tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.aitab.rep .late{color:#F08A3C;font-weight:800}.aitab.rep .abs{color:#E5544B;font-weight:800}.aitab.rep .ok{color:#3FBF7F;font-weight:700}
.add-btn{height:44px;padding:0 20px;border-radius:22px;border:0;background:var(--gold);color:#17130A;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:6px;padding:3px;border-radius:24px;background:#2A2C33;border:1px solid var(--line)}

/* hologram */
.holo{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 130% 75% at 50% 105%,#3B2716 0%,#1C140D 45%,#0C0A08 82%)}
.holo .bk{position:absolute;border-radius:50%;background:rgba(255,180,90,.33);filter:blur(3px)}
.holo .hz{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,190,110,.22),transparent)}
.holo .beam{position:absolute;left:50%;bottom:calc(12% + 36px);width:300px;height:330px;margin-left:-150px;background:linear-gradient(to top,rgba(255,190,100,.38),transparent);clip-path:polygon(22% 100%,78% 100%,100% 0,0 0);animation:beamIn 1.5s ease-out .25s both}
.holo .ring{position:absolute;left:50%;bottom:12%;width:340px;height:86px;margin-left:-170px;animation:ringIn .8s cubic-bezier(.2,.9,.25,1) .2s both}
.holo .ring .g{position:absolute;inset:-24px -30px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,170,70,.35),transparent 65%)}
.holo .ring .o{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,210,140,.95);box-shadow:0 0 16px rgba(255,180,80,.85),inset 0 0 14px rgba(255,180,80,.55);animation:ringPulse 2.6s ease-in-out infinite}
.holo .ring .n{position:absolute;top:16px;bottom:16px;left:44px;right:44px;border-radius:50%;border:1px solid rgba(255,210,140,.5)}
.holo .sp{position:absolute;width:3px;height:3px;border-radius:2px;background:#FFD98A;box-shadow:0 0 6px 2px rgba(255,200,110,.8);animation:spark 2.8s ease-out infinite}
.holo .shadow{position:absolute;left:50%;bottom:calc(12% + 30px);width:250px;height:30px;margin-left:-125px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);animation:ringIn .8s cubic-bezier(.2,.9,.25,1) .2s both}
.holo .dish{position:absolute;left:50%;bottom:calc(12% + 34px);width:420px;height:340px;margin-left:-210px;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;animation:dishIn 1.2s cubic-bezier(.2,.9,.25,1) .3s both}
.holo .dish>div{display:flex;align-items:flex-end;justify-content:center;animation:bob 3.6s ease-in-out 1.5s infinite}
.holo .dish img{display:block;max-width:420px;max-height:330px;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.6))}
.holo .lbl{position:absolute;top:50px;left:14px;display:flex;animation:labelIn 1.4s cubic-bezier(.2,.9,.25,1) .3s both}
.holo .lbl .num{width:36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,210,140,.55);background:rgba(20,15,9,.6);color:#F3D9A4;font-size:15px;font-weight:800}
.holo .lbl .tx{display:flex;flex-direction:column;gap:5px;padding:7px 12px;border:1px solid rgba(255,210,140,.55);border-left:0;background:rgba(20,15,9,.55);backdrop-filter:blur(6px)}
.holo .lbl .tx b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.holo .lbl .tx i{height:2px;width:44px;background:linear-gradient(90deg,rgba(255,210,140,.9),transparent)}
.holo .ln{position:absolute;top:92px;left:32px;width:1px;height:46px;transform-origin:50% 0;background:linear-gradient(rgba(255,210,140,.8),transparent);animation:lineIn 1.5s ease-out .3s both}
.vidwrap{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;z-index:2;pointer-events:none}
.vidwrap.show{opacity:1}
.badge.vid{opacity:0;transition:opacity .4s}
.media.has-vid .badge.vid{opacity:1}
.vidwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
/* photo → video: frosted-glass cross-fade done with pre-blurred snapshots (opacity only, smooth on phones) */
.slide.center .media .thumb{transition:opacity .25s}
.slide.center .media.has-vid .thumb{opacity:0;transition:none}
.slide.center .media .vidwrap{opacity:.011;transition:none}

.d-layer.has-vid img.big,.d-layer.has-vid img.big.cover{opacity:0;transition:none}

          inset 1.5px 0 0 rgba(140,185,255,.45),inset -1.5px 0 0 rgba(255,150,120,.45),0 10px 26px rgba(15,10,40,.30),0 1px 2px rgba(15,10,40,.25);

             radial-gradient(70% 22% at 50% 72%,rgba(70,220,170,.16),rgba(0,0,0,0) 70%)}
#sky{display:none}
html.th-aurora #sky{display:block;position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
html.th-aurora #sky>i,html.th-aurora #sky .sea>i{position:absolute;left:0}
html.th-aurora #sky .s1,html.th-aurora #sky .s2{top:0;width:100%;height:72%;background-repeat:repeat;background-size:512px 512px;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.25) 92%,transparent);mask-image:linear-gradient(180deg,#000 55%,rgba(0,0,0,.25) 92%,transparent)}

html.th-aurora #sky .a1,html.th-aurora #sky .a2{width:4800px;background-repeat:repeat-x;background-size:1600px 100%;mix-blend-mode:screen;transform-origin:50% 100%;will-change:transform}
html.th-aurora #sky .a1{top:20%;height:70%;background-image:url("media/n-aur1.webp");animation:auroraMove 90s linear infinite;opacity:.95}
html.th-aurora #sky .a2{top:24%;height:62%;background-image:url("media/n-aur2.webp");animation:auroraMove 130s linear infinite reverse;opacity:.7}
html.th-aurora #sky .sea{position:absolute;left:0;right:0;top:72%;bottom:0;overflow:hidden}
html.th-aurora #sky .sea>i{top:0}

html.th-aurora #sky .r1{top:-64.3%;height:250%;background-image:url("media/n-aur1r.webp");animation:auroraMove 90s linear infinite;opacity:1}
html.th-aurora #sky .r2{top:-50%;height:221.4%;background-image:url("media/n-aur2r.webp");animation:auroraMove 130s linear infinite reverse;opacity:.55}
html.th-aurora #sky .rs{width:100%;height:100%;background:url("media/n-starsr.webp") repeat;background-size:512px 512px;opacity:.55;

  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.35),#000 40%);mask-image:linear-gradient(180deg,rgba(0,0,0,.35),#000 40%)}

/* ================= THEME: Boarding pass — glass tickets above the night earth, departures-board tabs ================= */

function renderTabs(){
  var tb=$("tabs"); tb.innerHTML="";
  cats().forEach(function(c){
    if(!dishesOf(c.id).length) return;
    var b=document.createElement("button"); b.className="tab"; b.textContent=catL(c.id);
    b.setAttribute("aria-pressed", String(c.id===S.cat));
    b.onclick=function(){ if(S.cat!==c.id){ SFX.tick(); S.cat=c.id; S.idx=0; prevOff={}; renderTabs(); buildSlides(); } };
    tb.appendChild(b);

function fitTabs(){
  var tb=$("tabs"); if(!tb) return;
  tb.classList.remove("tight","tighter");

function tabTarget(tb,a){
  var max=tb.scrollWidth-tb.clientWidth, l=a.offsetLeft-tb.clientLeft;
  return Math.max(0, Math.min(max, Math.round(l + a.offsetWidth/2 - tb.clientWidth/2)));   /* the active tab sits in the middle */

  var ov=tb.scrollWidth>tb.clientWidth+2;

  tb.classList.toggle("fade-r", ov && tb.scrollLeft<tb.scrollWidth-tb.clientWidth-4);

/* gently slide the category row to the end and back, so guests see there is more to swipe */
var tabsHint=(function(){
  var api={busy:false}, lastTouch=0, raf=0, timer=0;
  function anim(tb,to,ms){
    return new Promise(function(done){
      var from=tb.scrollLeft, t0=performance.now();
      cancelAnimationFrame(raf);
      (function step(now){
        if(!api.busy){ done(false); return; }
        var k=Math.min(1,(now-t0)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        tb.scrollLeft=from+(to-from)*e; tabsEdges();
        if(k<1) raf=requestAnimationFrame(step); else done(true);
      })(t0);
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  async function run(){
    var tb=$("tabs"); if(!tb || api.busy) return;
    var max=tb.scrollWidth-tb.clientWidth;
    if(max<8 || S.view!=="menu" || S.detail || S.cartOpen || tb.classList.contains("hidden") || Date.now()-lastTouch<8000) return;
    api.busy=true;
    var a=tb.querySelector('[aria-pressed="true"]'), home=a?tabTarget(tb,a):0;
    var far = tb.scrollLeft < max/2 ? max : 0;
    var dur=Math.min(4200, 1400+Math.abs(far-tb.scrollLeft)*6);

    setTimeout(run,1800);
    timer=setInterval(run,14000);
  };
  return api;
})();

track.addEventListener("pointerdown",function(e){
  if(e.button!==undefined&&e.button!==0) return; if(e.target.closest(".arrow")) return;
  sx=e.clientX; sy=e.clientY; st=Date.now(); down=true; swiped=false; gMode=null;
  var c=e.target.closest(".slide.center .card"); tiltCard=c||null;
  if(tiltCard) tiltTo(tiltCard,e.clientX,e.clientY,.7);

  if(!down){

      if(hc){ tiltTo(hc,e.clientX,e.clientY,.5); } else if(cc && cc.classList.contains("tilting")) untilt(cc); }
    return;

  if(!S.dragging) SFX.swipe();

/* ---------- hidden admin entry: hold the logo for 3 s, or tap it 7 times quickly ---------- */
(function(){
  var tmr=null, box=$("logoBox"), taps=0, tapT=null, startX=0, startY=0;
  function openAdmin(){ cancel(); taps=0; location.hash="#admin"; }
  function cancel(){ if(tmr){ clearTimeout(tmr); tmr=null; } }
  function start(x,y){ cancel(); startX=x; startY=y; tmr=setTimeout(function(){ tmr=null; openAdmin(); },3000);
    taps++; clearTimeout(tapT); tapT=setTimeout(function(){ taps=0; },1500); if(taps>=7) openAdmin(); }
  function move(x,y){ if(tmr && (Math.abs(x-startX)>24 || Math.abs(y-startY)>24)) cancel(); }
  /* touch: block the system long-press (text selection / image menu) so the timer is not cancelled */
  box.addEventListener("touchstart",function(e){ e.preventDefault(); var t=e.touches[0]; start(t.clientX,t.clientY); },{passive:false});
  box.addEventListener("touchmove",function(e){ var t=e.touches[0]; move(t.clientX,t.clientY); },{passive:true});
  box.addEventListener("touchend",cancel); box.addEventListener("touchcancel",cancel);
  /* mouse / pen */
  box.addEventListener("pointerdown",function(e){ if(e.pointerType==="touch") return; start(e.clientX,e.clientY); });
  box.addEventListener("pointermove",function(e){ if(e.pointerType!=="touch") move(e.clientX,e.clientY); });
  ["pointerup","pointerleave"].forEach(function(ev){ box.addEventListener(ev,function(e){ if(e.pointerType!=="touch") cancel(); }); });
  box.addEventListener("contextmenu",function(e){ e.preventDefault(); });
  box.addEventListener("dragstart",function(e){ e.preventDefault(); });
})();

function svcPct(st){ st=st||S.settings||{}; var v=st.service; if(v===undefined||v===null||v==="") return 15; v=Math.round(Number(v)); return isFinite(v)?Math.max(0,Math.min(50,v)):15; }
var TABLE_KEY="uno_table", TABLE_QR_KEY="uno_table_qr", TABLE_QR_HOURS=4;
/* Two sources:
   - tablet: the admin sets the table once, it stays (uno_table + uno_table_src=admin);
   - customer's phone: the table comes from the QR code and is valid only for this visit (4 hours),
     so next time the customer can sit anywhere. */
(function(){
  try{
    /* old builds stored QR tables permanently: drop those (admin-set tables are marked) */
    if(localStorage.getItem(TABLE_KEY) && localStorage.getItem("uno_table_src")!=="admin") localStorage.removeItem(TABLE_KEY);
    var u=new URL(location.href), q=u.searchParams.get("stol");
    if(q!==null) window.__fromQR=true;
    if(q!==null){
      q=String(q).trim().slice(0,12);
      if(q && q!=="0") localStorage.setItem(TABLE_QR_KEY, JSON.stringify({t:q, at:Date.now()}));
      else localStorage.removeItem(TABLE_QR_KEY);
      /* remove ?stol= from the address, so a bookmark or home-screen icon does not bring the old table back */
      u.searchParams.delete("stol"); history.replaceState(null, "", u.pathname+(u.search||"")+u.hash);
    }
  }catch(_){}
})();
function qrTable(){
  try{ var o=JSON.parse(localStorage.getItem(TABLE_QR_KEY)||"null"); if(!o||!o.t) return "";
    if(Date.now()-Number(o.at||0) > TABLE_QR_HOURS*3600e3){ localStorage.removeItem(TABLE_QR_KEY); return ""; }
    return String(o.t).trim(); }catch(_){ return ""; }
}

function applyTheme(){

  Object.keys(THEMES).concat(Object.keys(PREVIEW_THEMES)).forEach(function(k){ root.classList.toggle("th-"+k, k===t && k!=="classic"); });
  var sky=document.getElementById("sky"); if(sky && sky.dataset.t!==t){ sky.dataset.t=t; sky.innerHTML=SKY_HTML[t]||""; sky.classList.remove("gl"); if(t==="liquid") liquidSky(sky); }

  var as=document.getElementById("admSky");
  if(t==="liquid"){ if(!as){ as=document.createElement("div"); as.id="admSky"; as.innerHTML='<canvas></canvas>'; document.body.insertBefore(as, document.body.firstChild); } if(as.dataset.t!=="liquid"){ as.dataset.t="liquid"; liquidSky(as, true); } }

  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t==="aurora"?"#010208":t==="boarding"?"#02040c":"#0E0F12");
  if(!url) try{ localStorage.setItem("uno_theme", t); }catch(_){}
}

   Chrome draws under the camera cutout only in "real" fullscreen (Fullscreen API + viewport-fit=cover),
   so the installed app switches to it on the guest's first touch. Exit: swipe from the edge / back. */
(function(){
  var android=/Android/i.test(navigator.userAgent);
  var app=window.matchMedia && (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches);
  if(!android || !app || window.UnoKiosk) return;

    if(document.fullscreenElement || !de.requestFullscreen) return;
    try{ var p=de.requestFullscreen({navigationUI:"hide"}); if(p&&p.catch) p.catch(function(){}); }catch(_){}
  }
  ["pointerup","touchend","click"].forEach(function(ev){ document.addEventListener(ev,go,{capture:true,passive:true}); });
  document.addEventListener("fullscreenchange",function(){ setTimeout(function(){ try{ fit(); }catch(_){} },150); });
})();

function callDone(kind, by){

  S.calls[kind]=null; refreshCallUI(); if(S.cartOpen) renderCart();

function watchCall(kind, id){
  var c={id:id};
  try{
    c.ch=S.sb.channel("call-"+id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"uno_calls",filter:"id=eq."+id},function(pl){
      if(pl.new && pl.new.status==="accepted") callDone(kind, pl.new.accepted_by);
    }).subscribe();
  }catch(_){}
  c.poll=setInterval(async function(){
    try{ var r=await S.sb.from("uno_calls").select("status,accepted_by").eq("id",id).maybeSingle();
      if(r.data && r.data.status==="accepted") callDone(kind, r.data.accepted_by);
      if(!r.error && !r.data) callDone(kind,""); /* older than 12 h */
    }catch(_){}
  },6000);
  /* give up waiting after 15 minutes so the button can be used again */
  c.expire=setTimeout(function(){ if(S.calls[kind]&&S.calls[kind].id===id){ clearInterval(c.poll); try{ S.sb.removeChannel(c.ch); }catch(_){} S.calls[kind]=null; refreshCallUI(); if(S.cartOpen) renderCart(); } },15*60000);

}
async function sendCall(kind){

  if(kind==="bill"){
    var items=cartItems(), sub=0; items.forEach(function(it){ sub+=it.q*(Number(it.d.price)||0); });
    if(items.length){ row.total=sub+Math.round(sub*svcPct()/100); row.items=items.map(function(it){ return {n:it.d.name, q:it.q, p:Number(it.d.price)||0}; }); }
  }
  S.calls[kind]={id:0,poll:null}; refreshCallUI(); if(S.cartOpen) renderCart();

async function gaiAsk(hist){
  var dev=gaiDev(), list=GAI.model?[GAI.model].concat(GAI_MODELS.filter(function(x){ return x!==GAI.model; })):GAI_MODELS.slice();
  var lastErr="err";
  for(var mi=0; mi<list.length; mi++){
    var r=await sbRpc("uno_guest_ai_ask",{p_device:dev, p_msgs:hist, p_lang:S.lang, p_model:list[mi]});
    if(r.error){ var em=String(r.error.message||r.error); if(/rate_limited/.test(em)) throw "busy"; throw "err"; }
    var id=r.data, t0=Date.now();
    while(Date.now()-t0<45000){
      await new Promise(function(ok){ setTimeout(ok, 900); });
      var q=await sbRpc("uno_guest_ai_reply",{p_id:id, p_device:dev});
      if(q.error) continue;
      var v=q.data||{};
      if(v.pending) continue;
      if(v.ok){ GAI.model=list[mi]; return v.text; }
      /* model gone (404/400) or busy (503, 500, timeout): try the next model */
      if(v.status===429 && mi===list.length-1) throw "busy";
      lastErr="model"; break;
    }
    if(lastErr!=="model") throw "err";
  }
  throw "err";
}

  GAI.msgs.push({role:"user", text:text}); GAI.busy=true; gaiRender();
  var hist=[], seen=false;
  GAI.msgs.forEach(function(m){ if(m.local||m.err) return; if(m.role==="user") seen=true; if(seen) hist.push({role:m.role, text:m.text}); });
  try{ var ans=await gaiAsk(hist.slice(-14)); GAI.msgs.push({role:"model", text:ans}); }
  catch(e){ GAI.msgs.push({role:"model", text:e==="busy"?gaiT().busy:gaiT().err, err:true, local:true}); }

var SB_TABLE="uno_docs", SB_BUCKET="uno-media", CACHE_KEY="uno_cache_v1";
function makeBackend(){
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  var cache={}, docL=[], colL=[], fresh=false;
  try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")||{}; }catch(_){ cache={}; }
  function save(){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify(cache)); }catch(_){} }
  function clone(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }
  function snapDoc(p,fc){ var d=cache[p]; return {exists:!!d, data:function(){ return clone(d); }, metadata:{fromCache:fc}}; }
  function snapCol(c,fc){ var pre=c+"/"; var docs=Object.keys(cache).filter(function(k){ return k.indexOf(pre)===0 && k.slice(pre.length).indexOf("/")<0; }).map(function(k){ return {id:k.slice(pre.length), data:function(){ return clone(cache[k]); }}; }); return {docs:docs, size:docs.length, metadata:{fromCache:fc}}; }
  function emit(fc){ docL.forEach(function(l){ try{ l.cb(snapDoc(l.p,fc)); }catch(e){ console.error(e); } }); colL.forEach(function(l){ try{ l.cb(snapCol(l.c,fc)); }catch(e){ console.error(e); } }); }
  var fetching=null;
  function fetchAll(){
    if(fetching) return fetching;
    fetching=sb.from(SB_TABLE).select("path,data").then(function(r){
      fetching=null;
      if(r.error) throw r.error;
      var n={}; (r.data||[]).forEach(function(row){ n[row.path]=row.data||{}; });
      cache=n; fresh=true; window.__unoFresh=true; save(); emit(false);
      try{ window.dispatchEvent(new CustomEvent("uno-db-ok")); }catch(_){}
    }).catch(function(e){ fetching=null; console.warn("fetch",e); emit(true);
      try{ window.dispatchEvent(new CustomEvent("uno-db-error",{detail:(e&&(e.message||e.code))||String(e)})); }catch(_){}
      setTimeout(fetchAll,15000); });
    return fetching;
  }
  sb.channel("uno-docs").on("postgres_changes",{event:"*",schema:"public",table:SB_TABLE},function(pl){
    if(pl.eventType==="DELETE"){ if(pl.old&&pl.old.path) delete cache[pl.old.path]; else { fetchAll(); return; } }
    else if(pl.new&&pl.new.path){ cache[pl.new.path]=pl.new.data||{}; }
    save(); emit(false);
  }).subscribe(function(st){ if(st==="SUBSCRIBED") fetchAll(); });
  setInterval(fetchAll,60000);

  window.addEventListener("online",fetchAll);
  fetchAll();
  function ref(p){
    return {
      id:p.split("/").pop(),
      set:async function(data){ var r=await sb.from(SB_TABLE).upsert({path:p,data:data,updated_at:new Date().toISOString()}); if(r.error) throw r.error; cache[p]=clone(data); save(); emit(false); },

      delete:async function(){ var r=await sb.from(SB_TABLE).delete().eq("path",p); if(r.error) throw r.error; delete cache[p]; save(); emit(false); },
      onSnapshot:function(cb){ docL.push({p:p,cb:cb}); if(fresh||Object.keys(cache).length) setTimeout(function(){ cb(snapDoc(p,!fresh)); },0); }
    };
  }
  var db={
    doc:function(p){ return ref(p); },
    collection:function(c){ return {
      doc:function(id){ return ref(c+"/"+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,7)))); },
      onSnapshot:function(cb){ colL.push({c:c,cb:cb}); if(fresh||Object.keys(cache).length) setTimeout(function(){ cb(snapCol(c,!fresh)); },0); }
    }; }
  };
  var EXT={"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/svg+xml":"svg","video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"};
  var assets={
    upload:async function(file){
      var t=file.type||"application/octet-stream", ext=EXT[t]||((file.name||"").split(".").pop()||"bin");
      var name=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
      var r=await sb.storage.from(SB_BUCKET).upload(name,file,{contentType:t,cacheControl:"31536000",upsert:false});
      if(r.error) throw r.error;
      return {id:name};
    },
    delete:async function(id){ if(!id||/[\/:]/.test(id)) return; await sb.storage.from(SB_BUCKET).remove([id]); }
  };
  db.seedIfEmpty=async function(){
    var c=await sb.from(SB_TABLE).select("path",{count:"exact",head:true});
    if(c.error || (c.count||0)>0) return false;

    var r=await sb.from(SB_TABLE).upsert(rows,{onConflict:"path",ignoreDuplicates:true});
    if(r.error) throw r.error; await fetchAll(); return true;
  };
  return {sb:sb, db:db, assets:assets};
}

var GEM_BASE="https://generativelanguage.googleapis.com/v1beta";
function makeGemini(){
  var keyCache=null;
  async function key(){
    if(keyCache) return keyCache;
    if(!S.sb) throw {code:"no_key"};
    var r=await S.sb.rpc("uno_get_ai_key");
    if(r.error) throw {code: /uno_get_ai_key|function/.test(r.error.message||"")?"no_sql":"no_key"};
    if(!r.data) throw {code:"no_key"};
    keyCache=String(r.data); return keyCache;
  }
  async function pickModel(k, skip){
    var saved=""; try{ saved=localStorage.getItem("uno_gem_model")||""; }catch(_){}
    if(saved && saved!==skip) return saved;
    var list=[];
    try{
      var res=await fetch(GEM_BASE+"/models?pageSize=200",{headers:{"x-goog-api-key":k}});
      if(res.status===400||res.status===403) throw {code:"bad_key"};
      var js=await res.json();
      list=(js.models||[]).filter(function(m){ return (m.supportedGenerationMethods||[]).indexOf("generateContent")>=0; })
        .map(function(m){ return String(m.name||"").replace(/^models\//,""); })
        .filter(function(n){ return /flash/.test(n) && !/image|tts|live|audio|embed|thinking|exp|preview|8b/.test(n) && n!==skip; });
    }catch(e){ if(e&&e.code) throw e; }
    function score(n){ var v=(n.match(/(\d+(?:\.\d+)?)/)||[0,0])[1]*1; return (/latest/.test(n)?1000:0)+v*10-(/lite/.test(n)?5:0); }
    list.sort(function(a,b){ return score(b)-score(a); });
    var m=list[0]||(skip==="gemini-2.5-flash"?"gemini-flash-latest":"gemini-2.5-flash");
    try{ localStorage.setItem("uno_gem_model",m); }catch(_){}
    return m;
  }
  async function toPart(b){
    /* shrink the photo to 1024 px so the request stays small and fast */
    var mime="image/jpeg", data;
    try{
      var bmp=await createImageBitmap(b), sc=Math.min(1,1024/Math.max(bmp.width,bmp.height));
      var c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
      var x=c.getContext("2d"); x.fillStyle="#ffffff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
      data=c.toDataURL("image/jpeg",0.86).split(",")[1];
    }catch(_){
      mime=b.type||"image/jpeg";
      data=await new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res(String(fr.result).split(",")[1]); }; fr.onerror=rej; fr.readAsDataURL(b); });
    }
    return {inline_data:{mime_type:mime,data:data}};
  }
  function parse(txt){
    txt=String(txt||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    try{ return JSON.parse(txt); }catch(_){}
    var a=txt.indexOf("{"), b=txt.lastIndexOf("}"), a2=txt.indexOf("["), b2=txt.lastIndexOf("]");
    if(a2>=0 && (a<0||a2<a)) { try{ return JSON.parse(txt.slice(a2,b2+1)); }catch(_){} }
    if(a>=0) { try{ return JSON.parse(txt.slice(a,b+1)); }catch(_){} }
    throw {code:"invalid_json"};
  }
  async function json(prompt, opt){
    opt=opt||{};

function enhanceImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var max=1200, s=Math.min(1, max/Math.max(im.naturalWidth,im.naturalHeight));
      var w=Math.round(im.naturalWidth*s), h=Math.round(im.naturalHeight*s);
      var c=document.createElement("canvas"); c.width=w; c.height=h; var ctx=c.getContext("2d");
      ctx.filter="brightness(1.05) contrast(1.1) saturate(1.22)"; ctx.drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      /* WebP (or JPEG) at 0.82: 5–10× smaller than PNG, looks the same on a phone */
      c.toBlob(function(b){
        if(b && b.type==="image/webp") return resolve(b);
        c.toBlob(function(j){ j?resolve(j):reject(new Error("canvas")); }, "image/jpeg", .84);
      }, "image/webp", .82);
    };
    im.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("Rasmni o'qib bo'lmadi")); };
    im.src=url;
  });
}
async function handleFile(kind,file){
  var E=S.editing; if(!E) return; var m=$("edMsg");
  if(!S.assets){ msg(m,"Fayl yuklash bu ko'rinishda mavjud emas.","err"); return; }
  if(kind==="img" && !/^image\//.test(file.type)){ msg(m,"Faqat rasm fayli (PNG, JPG) tanlang.","err"); return; }
  if(kind==="vid" && !/^video\//.test(file.type)){ msg(m,"Faqat video fayli (MP4) tanlang.","err"); return; }
  if(file.size>20*1024*1024){ msg(m,"Fayl 20 MB dan katta. Kichikroq fayl tanlang.","err"); return; }
  msg(m,"");
  E[kind==="img"?"uploadingImg":"uploadingVid"]=true; updateEditorMedia();
  try{
    var body=file;
    if(kind==="img" && E.enhance){ try{ body=await enhanceImage(file); }catch(_){ body=file; } }
    var r=await netRetry(function(){ return S.assets.upload(body); }, 3);
    if(S.editing!==E){ S.assets.delete(r.id).catch(function(){}); return; }
    if(kind==="img"){ try{ var dim=await new Promise(function(res){ var im=new Image(); im.onload=function(){ res([im.naturalWidth,im.naturalHeight]); }; im.onerror=function(){ res(null); }; im.src=blob(r.id); });
      if(dim && Math.abs(dim[0]/dim[1]-1)>0.03) setTimeout(function(){ msg($("edMsg"),"Diqqat: surat kvadrat emas ("+dim[0]+" × "+dim[1]+"). Menyuda chetlari kesilib ko'rinadi. 1080 × 1080 px tavsiya etiladi."); },0);
    }catch(_){} }
    E.tempUploads=(E.tempUploads||[]).concat([r.id]);
    if(kind==="img") E.imgId=r.id; else E.videoId=r.id;
    if(kind==="img") E.aiImg=body;
    if(kind==="img" && S.sample && S.aiOn){ E.aiAuto=true; setTimeout(function(){ if(S.editing===E) aiEstimateOne(); },50); }
  }catch(err){ msg(m,"Yuklab bo'lmadi: "+((err&&err.message)||"xatolik"),"err"); }
  E.uploadingImg=false; E.uploadingVid=false; updateEditorMedia();
}
async function saveDish(){
  var E=S.editing, m=$("edMsg");
  if(S.cred && !sessionOK()){ msg(m,"Sessiya tugadi. Qaytadan kiring.","err"); closeEditor(); renderAdmin(); return; }
  var name=$("edName").value.trim(), price=Number(String($("edPrice").value).replace(/[^\d]/g,"")), cat=$("edCat").value, desc=$("edDesc").value.trim();
  var gv=function(id){ var el=$(id); return el?el.value.trim():""; };
  if(!name){ msg(m,"Taom nomini (o'zbekcha) kiriting.","err"); var tb=document.querySelector('[data-lt="uz"]'); if(tb) tb.click(); $("edName").focus(); return; }
  if(!price){ msg(m,"Narxni kiriting (faqat raqam).","err"); $("edPrice").focus(); return; }
  if(!cat){ msg(m,"Avval kategoriya qo'shing.","err"); return; }
  if(S.sample && S.aiOn && !E.trTried){
    E.trTried=true; $("edSave").disabled=true; msg(m,"Ruscha va inglizcha tarjima qilinmoqda…");
    await Promise.race([trEditor(true), new Promise(function(r){ setTimeout(r,25000); })]);
    $("edSave").disabled=false;
  }
  var order = E.id ? (E.order||0) : (dishesOf(cat).reduce(function(mx,d){return Math.max(mx,d.order||0);},0)+10);
  if(E.id && E.cat!==cat) order = dishesOf(cat).reduce(function(mx,d){return Math.max(mx,d.order||0);},0)+10;
  var data={name:name, price:price, cat:cat, desc:desc, ingr:gv("edIngr"),
    name_ru:gv("edName_ru"), desc_ru:gv("edDesc_ru"), ingr_ru:gv("edIngr_ru"),
    name_en:gv("edName_en"), desc_en:gv("edDesc_en"), ingr_en:gv("edIngr_en"),
    weight:gv("edWeight"), time:Number(String(gv("edTime")).replace(/[^\d]/g,""))||0,
    kcal:Number(String(gv("edKcal")).replace(/[^\d]/g,""))||0, prot:Number(String(gv("edProt")).replace(/[^\d]/g,""))||0,
    fat:Number(String(gv("edFat")).replace(/[^\d]/g,""))||0, carb:Number(String(gv("edCarb")).replace(/[^\d]/g,""))||0, kcalEst:!!E.kcalEst,
    imgId:E.imgId||"", videoId:E.videoId||"", order:order, updatedAt:new Date().toISOString()};
  $("edSave").disabled=true; msg(m,"Saqlanmoqda…");
  try{
    var ref = E.id ? S.db.doc("dishes/"+E.id) : S.db.collection("dishes").doc();
    if(!E.id) E.id=ref.id||(ref.path||"").split("/").pop()||E.id;   /* a retry must update the same dish, not make a second one */
    await netRetry(function(){ return ref.set(data); });
    // remove replaced media
    if(S.assets){
      if(E.origImg && E.origImg!==data.imgId) S.assets.delete(E.origImg).catch(function(){});
      if(E.origVid && E.origVid!==data.videoId) S.assets.delete(E.origVid).catch(function(){});
      (E.tempUploads||[]).forEach(function(a){ if(a!==data.imgId && a!==data.videoId) S.assets.delete(a).catch(function(){}); });
    }
    E.tempUploads=[]; S.editing=null; var host=$("editorHost"); host.innerHTML=""; host.dataset.open="";
  }catch(err){ msg(m, errText(err), "err"); $("edSave").disabled=false; }
}

Att.repFines=function(r){

Att.repDays=function(rows,FN){

    var fs=FN.by[x.s.id+"|"+d.key]||[], live=fs.filter(function(f){ return f.status!=="excused"; }), amt=(live.length?live:fs).reduce(function(a,f){ return a+f.amount; },0);
    var st=!fs.length?"":!live.length?"sababli":live.every(function(f){ return f.paid_at; })?"to'langan":"to'lanmagan";
    (map[d.key]=map[d.key]||[]).push({s:x.s, shift:String(x.s.shift_start||"").slice(0,5), inAt:d.inAt, outAt:d.outAt, late:d.late||0, fine:amt, fineSt:st, fineEx:!live.length&&fs.length}); }); });

/* ---------- offline: keep every dish photo and video on the tablet ---------- */
var MEDIA_CACHE="uno-media-v1";
var Offline={busy:false,total:0,done:0,saved:0,failed:0,t:0};
function mediaUrls(){
  var out=[], seen={};
  function add(id){ if(!id) return; var u=new URL(blob(id),location.href).href; if(!seen[u]){ seen[u]=1; out.push(u); } }
  if(S.settings) add(S.settings.logoId);
  (S.dishes||[]).forEach(function(d){ add(d.imgId); add(d.videoId); });
  return out;
}
/* downloading every photo and video in advance costs traffic: only on menu tablets / kiosks, never on guests' phones */
function offlineDevice(){ try{ if(localStorage.getItem("uno_offline")==="1") return true; }catch(_){} return !!(window.UnoKiosk); }
async function syncMedia(force){
  if(!force && !offlineDevice()) return;
  if(!("caches" in window) || Offline.busy || navigator.onLine===false || !(S.dishes&&S.dishes.length)) return;
  Offline.busy=true; Offline.failed=0;
  try{
    var c=await caches.open(MEDIA_CACHE), urls=mediaUrls();
    Offline.total=urls.length; Offline.done=0; Offline.saved=0; offlineUI();
    for(var i=0;i<urls.length;i++){
      var u=urls[i], hit=await c.match(u);
      if(!hit){
        try{ var res=await fetch(u,{mode:"cors"}); if(res.ok){ await c.put(u,res); hit=true; } else Offline.failed++; }
        catch(e){ Offline.failed++; }
      }
      if(hit) Offline.saved++;
      Offline.done++; offlineUI();
    }
    /* forget photos and videos that are no longer in the menu (only after a fresh sync) */
    if(window.__unoFresh && !Offline.failed){
      var keys=await c.keys();
      for(var k=0;k<keys.length;k++){ if(urls.indexOf(keys[k].url)<0) await c.delete(keys[k]); }
    }
  }catch(e){ console.warn("offline sync",e); }
  Offline.busy=false; Offline.last=Date.now(); offlineUI();
}
function offlineUI(){
  var el=$("offStat"); if(!el) return;
  var all=Offline.total||mediaUrls().length;
  el.innerHTML = Offline.busy
    ? 'Yuklanmoqda: '+Offline.done+' / '+all+' <div class="progress" style="margin-top:8px"><i style="width:'+Math.round(100*Offline.done/Math.max(1,all))+'%;animation:none"></i></div>'
    : (Offline.last ? ('Planshetda saqlangan: <b>'+Offline.saved+' / '+all+'</b> ta rasm va video'+(Offline.failed?' · <span style="color:#ff9a8a">'+Offline.failed+' tasi yuklanmadi</span>':' ✅')) : 'Tekshirilmoqda…');
}
window.addEventListener("online",function(){ setTimeout(syncMedia,3000); });
setInterval(syncMedia, 30*60000);
/* load the Supabase library without blocking the page; give up after a few seconds when offline */
function loadSupabase(ms){
  return new Promise(function(done){
    if(window.supabase) return done(true);
    var fin=false, t=setTimeout(function(){ if(!fin){ fin=true; done(false); } }, ms);
    var sc=document.createElement("script");
    function add(src){ var sc=document.createElement("script"); sc.src=src;
      sc.onload=function(){ if(!fin && window.supabase){ fin=true; clearTimeout(t); done(true); } };
      sc.onerror=function(){ if(src.indexOf("jsdelivr")>0) add2(); else if(!fin){ fin=true; clearTimeout(t); done(false); } };
      document.head.appendChild(sc); }
    var second=false; function add2(){ if(second||fin) return; second=true; add("https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"); }
    add("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
    setTimeout(add2, Math.min(3000, ms/2));   /* first CDN slow → try the second one in parallel */
  });
}

function agFrames(a){

    var to=setTimeout(function(){ a.frames=out; res(out); }, 12000);

      c.getContext("2d").drawImage(v,0,0,c.width,c.height); c.toBlob(function(b){ if(b) out.push(b); next(); },"image/jpeg",.86); }catch(e){ next(); } }

/* ---------- voice: record 16 kHz mono WAV (works on iPhone and Android without extra libraries) ---------- */
async function agRecStart(){
  if(AG.rec||AG.busy) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ agSay("ai","Bu qurilmada mikrofon ishlamaydi. Yozib yuboring."); return; }
  var stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}}); }
  catch(e){ agSay("ai","Mikrofonga ruxsat berilmadi. Brauzer sozlamalarida shu sayt uchun mikrofonni yoqing."); return; }
  var AC=window.AudioContext||window.webkitAudioContext, ctx=new AC(), src=ctx.createMediaStreamSource(stream), proc=ctx.createScriptProcessor(4096,1,1), chunks=[];
  proc.onaudioprocess=function(e){ chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(proc); proc.connect(ctx.destination);
  if(ctx.state==="suspended") try{ await ctx.resume(); }catch(_){}
  AG.rec={stream:stream,ctx:ctx,src:src,proc:proc,chunks:chunks,rate:ctx.sampleRate,t0:Date.now()};
  $("agRec").hidden=false; $("agPanel").classList.add("recording");
  AG.rec.tick=setInterval(function(){ var s=Math.floor((Date.now()-AG.rec.t0)/1000); $("agRecT").textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2); if(s>=90) agRecStop(true); },250);
  try{ navigator.vibrate&&navigator.vibrate(15); }catch(_){}
}
function agRecStop(send){

  try{ r.proc.disconnect(); r.src.disconnect(); }catch(_){} r.stream.getTracks().forEach(function(t){ t.stop(); }); try{ r.ctx.close(); }catch(_){}
  $("agRec").hidden=true; $("agPanel").classList.remove("recording");
  if(!send) return;
  var secs=(Date.now()-r.t0)/1000; if(secs<0.7){ agSay("ai","Juda qisqa. Mikrofon tugmasini bosib, gapiring, keyin «Yuborish»."); return; }
  var wav=agWav(r.chunks,r.rate,16000);

function agWav(chunks, inRate, outRate){
  var n=chunks.reduce(function(a,c){ return a+c.length; },0), all=new Float32Array(n), o=0;
  chunks.forEach(function(c){ all.set(c,o); o+=c.length; });
  var ratio=inRate/outRate, len=Math.floor(n/ratio), pcm=new Int16Array(len);
  for(var i=0;i<len;i++){ var a=Math.floor(i*ratio), b=Math.min(n,Math.floor((i+1)*ratio)), s=0, k=0; for(var j=a;j<b;j++){ s+=all[j]; k++; } var v=k?s/k:0; v=Math.max(-1,Math.min(1,v*1.6)); pcm[i]=v<0?v*0x8000:v*0x7FFF; }
  var buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf);
  function w(off,str){ for(var i=0;i<str.length;i++) dv.setUint8(off+i,str.charCodeAt(i)); }
  w(0,"RIFF"); dv.setUint32(4,36+pcm.length*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,outRate,true); dv.setUint32(28,outRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  return new Blob([buf],{type:"audio/wav"});
}

async function agSend(m){

  var ub=agSay("me",bub,true);

    var parts=[];

    for(var i=0;i<newAtts.length;i++){

              tool_config:{function_calling_config:{mode:"AUTO"}}, generationConfig:{temperature:0.3}};

    var js=await S.sample.call(body,{fast:true, onText:function(t){
      var show=t.replace(/^\s*🎤[^\n]*\n?/,"").trim(); if(!show) return;
      agTyping(false); if(!AG._sb){ AG._sb=agSay("ai",""); } if(AG._sb) AG._sb.innerHTML=esc(show).replace(/\n/g,"<br>"); agScroll(); }});
    if(AG._sb){ AG._sb.remove(); AG.msgs.pop(); AG._sb=null; }
    var cand=js.candidates&&js.candidates[0], content=cand&&cand.content;
    if(!content||!content.parts||!content.parts.length){ agTyping(false); agSay("ai","Javob bo'lmadi"+(cand&&cand.finishReason?" ("+cand.finishReason+")":"")+". Boshqacha aytib ko'ring."); return; }
    content.role="model"; AG.hist.push(content);
    var txt=content.parts.map(function(p){ return p.text&&!p.thought?p.text:""; }).join("").trim();
    var calls=content.parts.filter(function(p){ return p.functionCall; }).map(function(p){ return p.functionCall; });
    /* voice transcript → show it in the admin's bubble and keep text instead of audio in the history */
    var mt=txt.match(/^\s*🎤\s*[«"]?([^\n]+?)[»"]?\s*(\n|$)/);
    if(mt){ txt=txt.slice(mt[0].length).trim(); if(AG._ub){ var v=AG._ub.querySelector(".ag-voice"); if(v) v.insertAdjacentHTML("afterend",'<div class="ag-tr">«'+esc(mt[1])+'»</div>'); }
      if(AG._voiceTurn>=0&&AG.hist[AG._voiceTurn]) AG.hist[AG._voiceTurn].parts=AG.hist[AG._voiceTurn].parts.map(function(p){ return p.inline_data&&/audio/.test(p.inline_data.mime_type)?{text:"(voice message transcript: «"+mt[1]+"»)"}:p; }); AG._voiceTurn=-1; }
    agTyping(false);
    if(txt) agSay("ai",txt);
    if(!calls.length) return;
    var reads=calls.filter(function(c){ return !AG_WRITE[c.name]; }), writes=calls.filter(function(c){ return AG_WRITE[c.name]; });
    if(writes.length){
      /* read calls in the same turn are answered now; writes wait for the admin */
      var rr=[]; for(var i=0;i<reads.length;i++) rr.push(await agRunRead(reads[i]));
      for(var w=0;w<writes.length;w++){ var pv=AG_PREVIEW[writes[w].name]; if(pv){ try{ writes[w]._pv=await pv(writes[w].args||{}); }catch(e){ writes[w]._pv={n:null,err:String((e&&e.message)||e)}; } } }
      AG.pending={calls:writes, reads:rr};
      agCard(writes); return;
    }
    var resp=[]; for(var k=0;k<reads.length;k++) resp.push(await agRunRead(reads[k]));
    AG.hist.push({role:"user",parts:resp}); agTyping(true);
  }
}

function agTrim(h){

  return h.slice(keepFrom).map(function(c,idx){ var real=idx+keepFrom; if(c.role!=="user"||real>=lastUser-2) return c;
    return {role:c.role, parts:c.parts.map(function(p){ return p.inline_data?{text:"(media sent earlier)"}:p; })}; });
}

  }
  if(c.name==="delete_category"){
    var cs=cats(), cc=cs.find(function(x){ return x.id===a.cat_id; }); if(!cc) return {ok:false,error:"kategoriya topilmadi"};
    var ds=dishesOf(cc.id);
    if(ds.length&&!a.delete_dishes) return {ok:false,error:"ichida "+ds.length+" ta taom bor", label:cc.label};

  }
  if(c.name==="add_staff"||c.name==="update_staff"){
    if(!AG.staff) await agLoadStaff();
    var old=c.name==="update_staff"?(AG.staff||[]).find(function(x){ return x.id===a.staff_id; }):null;
    if(c.name==="update_staff"&&!old) return {ok:false,error:"xodim topilmadi"};
    var row={}; ["name","role","team","shift_start","shift_end"].forEach(function(k){ if(a[k]!==undefined) row[k]=String(a[k]).trim(); });
    if(a.days) row.days=a.days.map(Number).filter(function(x){ return x>=1&&x<=7; }).sort();
    if(a.active!==undefined) row.active=!!a.active;
    if(a.pin!==undefined) row.pin=String(a.pin).replace(/\D/g,"");
    if(c.name==="add_staff"){ if(!row.name) return {ok:false,error:"ism yo'q"}; row.role=row.role||""; row.team=row.team||""; row.shift_start=row.shift_start||"10:00"; row.shift_end=row.shift_end||"23:00"; row.days=row.days&&row.days.length?row.days:[1,2,3,4,5,6,7]; row.active=true;
      if(!row.pin){ var used={}; (AG.staff||[]).forEach(function(x){ if(x.active) used[x.pin]=1; }); do{ row.pin=String(1000+Math.floor(Math.random()*9000)); }while(used[row.pin]); } }
    if(row.pin!==undefined && !/^\d{4}$/.test(row.pin)) return {ok:false,error:"PIN 4 ta raqam bo'lishi kerak"};
    if(row.pin && (AG.staff||[]).some(function(x){ return x.active && x.pin===row.pin && (!old||x.id!==old.id); })) return {ok:false,error:"bu PIN boshqa xodimda bor"};
    r=c.name==="add_staff"?await S.sb.from("uno_staff").insert(row):await S.sb.from("uno_staff").update(row).eq("id",old.id);
    if(r.error) return {ok:false,error:/duplicate|pin_active/.test(r.error.message)?"bu PIN boshqa xodimda bor":r.error.message};
    await agLoadStaff(); try{ if(typeof Att!=="undefined"&&Att.el){ Att.load("staff"); } }catch(_){}
    return {ok:true, label:(c.name==="add_staff"?"Xodim qo'shildi: "+row.name+" (PIN "+row.pin+")":"Xodim o'zgartirildi: "+(row.name||old.name))};
  }
  if(c.name==="delete_staff"){
    if(!AG.staff) await agLoadStaff(); var p=(AG.staff||[]).find(function(x){ return x.id===a.staff_id; }); if(!p) return {ok:false,error:"xodim topilmadi"};
    r=await S.sb.from("uno_staff").delete().eq("id",p.id); if(r.error) return {ok:false,error:r.error.message};
    await agLoadStaff(); try{ if(typeof Att!=="undefined"&&Att.el){ Att.load(); } }catch(_){}
    return {ok:true, label:"Xodim o'chirildi: "+p.name};
  }
  if(c.name==="teach_guest_ai"){
    var tx=String(a.text||"").replace(/\s+/g," ").trim().slice(0,300); if(!tx) return {ok:false,error:"matn yo'q"};
    var ns=aiNotesOf(S.settings); if(ns.length>=40) return {ok:false,error:"40 ta ma'lumot to'ldi — avval keraksizini olib tashlang"};
    var nid="n"+Date.now().toString(36); ns.push({id:nid,text:tx,at:new Date().toISOString()});
    await netRetry(function(){ return saveSettings({aiNotes:ns}); }); S.settings.aiNotes=ns;
    return {ok:true, note_id:nid, label:"Mijozlar UNO AI'siga yetkazildi"};
  }
  if(c.name==="forget_guest_ai"){
    var ns2=aiNotesOf(S.settings), left=ns2.filter(function(n){ return n.id!==a.note_id; }); if(left.length===ns2.length) return {ok:false,error:"topilmadi"};
    await netRetry(function(){ return saveSettings({aiNotes:left}); }); S.settings.aiNotes=left;
    return {ok:true, label:"Mijozlar UNO AI'sidan olib tashlandi"};
  }
  if(c.name==="update_booking"){
    if(["new","confirmed","cancelled"].indexOf(a.status)<0) return {ok:false,error:"noto'g'ri holat"};
    r=await S.sb.from("uno_bookings").update({status:a.status}).eq("id",a.booking_id); if(r.error) return {ok:false,error:r.error.message};
    return {ok:true, label:"Bron #"+a.booking_id+": "+({new:"yangi",confirmed:"tasdiqlandi",cancelled:"bekor qilindi"})[a.status]};
  }
  if(c.name==="delete_bookings"){
    var q=S.sb.from("uno_bookings").delete(); if(a.booking_ids&&a.booking_ids.length) q=q.in("id",a.booking_ids); else if(a.before) q=q.lt("at",attDayStart(a.before).toISOString()); else return {ok:false,error:"qaysi bronlar — aniq emas"};
    r=await q.select("id"); if(r.error) return {ok:false,error:r.error.message};
    return {ok:true, deleted:(r.data||[]).length, label:"Bronlar o'chirildi: "+(r.data||[]).length+" ta"};
  }
  return null;
}

/* ---------- tools: read ---------- */
async function agRunRead(c){
  var a=c.args||{}, out;
  try{
    var ext=await agRunRead2(c); if(ext) return agFR(c,ext);
    if(c.name==="get_reviews"){
      var q=S.sb.from("uno_reviews").select("id,dish_id,stars,name,comment,hidden,updated_at").order("updated_at",{ascending:false}).limit(Math.min(80,a.limit||40));
      if(a.dish_id) q=q.eq("dish_id",a.dish_id); if(a.low_only) q=q.lte("stars",3);
      var r=await q; if(r.error) throw r.error;
      out={ok:true, reviews:(r.data||[]).map(function(x){ var d=agDish(x.dish_id); return {id:x.id, dish:d?d.name:x.dish_id, stars:x.stars, name:x.name||"", comment:x.comment||"", hidden:x.hidden, date:String(x.updated_at).slice(0,10)}; })};
    } else if(c.name==="get_attendance"){
      var day=/^\d{4}-\d{2}-\d{2}$/.test(a.date||"")?a.date:agToday(), st=attDayStart(day), en=new Date(st.getTime()+864e5);
      var s1=await S.sb.from("uno_staff").select("id,name,role,team,shift_start,shift_end,days,active").eq("active",true);
      var s2=await S.sb.from("uno_att").select("staff_id,kind,at,late_min,early_min,worked_min").gte("at",st.toISOString()).lt("at",en.toISOString()).order("at");
      if(s1.error) throw s1.error; if(s2.error) throw s2.error;
      var dow=attDow(day);
      out={ok:true, date:day, staff:(s1.data||[]).map(function(p){ var mine=(s2.data||[]).filter(function(x){ return x.staff_id===p.id; }), inn=mine.find(function(x){ return x.kind==="in"; }), outp=mine.filter(function(x){ return x.kind==="out"; }).pop();
        return {name:p.name, team:p.team||"", role:p.role||"", works_today:(p.days||[]).indexOf(dow)>=0, shift:String(p.shift_start).slice(0,5)+"–"+String(p.shift_end).slice(0,5),
          came:inn?attHM(inn.at):null, late_min:inn?inn.late_min||0:null, left:outp?attHM(outp.at):null, worked_min:outp?outp.worked_min:null}; })};
    } else if(c.name==="open_section"){
      var want=String(a.section||"").toLowerCase(), btns=[].slice.call(document.querySelectorAll("#adminView .adm-tabs button")), hit=btns.find(function(b){ return b.textContent.toLowerCase().indexOf(want)>=0||want.indexOf(b.textContent.toLowerCase())>=0; });
      if(hit){ hit.click(); out={ok:true, opened:hit.textContent}; } else out={ok:false, error:"section not found", available:btns.map(function(b){ return b.textContent; })};
    } else out={ok:false,error:"unknown tool"};
  }catch(e){ out={ok:false, error:String((e&&e.message)||e)}; }
  return agFR(c,out);
}

/* ---------- tools: write (run after the admin confirms) ---------- */
async function agUpload(att, as){
  if(!att) throw new Error("fayl topilmadi");
  if(as==="video"){ if(att.upVid) return att.upVid; var r=await netRetry(function(){ return S.assets.upload(att.file); },3); att.upVid=r.id; return r.id; }
  if(att.upImg) return att.upImg;
  var src=att.file;
  if(att.kind==="video"){ var fr=await agFrames(att); src=fr[1]||fr[0]; if(!src) throw new Error("videodan rasm olib bo'lmadi"); }
  var body=src; try{ body=await enhanceImage(src); }catch(_){}
  var r2=await netRetry(function(){ return S.assets.upload(body); },3); att.upImg=r2.id; return r2.id;
}
var AG_FIELDS=["name","name_ru","name_en","desc","desc_ru","desc_en","ingr","ingr_ru","ingr_en","weight"];
var AG_NUMS=["price","time","kcal","prot","fat","carb"];
function agCatId(v){ var cs=cats(); v=String(v||"").trim(); var c=cs.find(function(x){ return x.id===v; })||cs.find(function(x){ return [x.label,x.label_ru,x.label_en].some(function(l){ return l&&l.toLowerCase()===v.toLowerCase(); }); }); return c?c.id:""; }
async function agRunWrite(c){
  var a=c.args||{};
  var ext=await agRunWrite2(c); if(ext) return ext;
  if(c.name==="add_dish"){
    var cat=agCatId(a.cat); if(!cat) return {ok:false,error:"kategoriya topilmadi: "+a.cat, label:a.name};
    var price=Math.round(Number(a.price)||0); if(!price) return {ok:false,error:"narx yo'q", label:a.name};
    var data={cat:cat, price:price, kcalEst:true, imgId:"", videoId:"", updatedAt:new Date().toISOString(),
      order:dishesOf(cat).reduce(function(mx,d){ return Math.max(mx,d.order||0); },0)+10};
    AG_FIELDS.forEach(function(k){ data[k]=String(a[k]||"").trim(); });
    AG_NUMS.forEach(function(k){ if(k!=="price") data[k]=Math.max(0,Math.round(Number(a[k])||0)); });
    var pa=agAtt(a.photo), va=agAtt(a.video);
    if(va&&va.kind!=="video"){ pa=pa||va; va=null; }
    if(pa&&pa.kind==="video"&&!va) va=pa;
    if(va) data.videoId=await agUpload(va,"video");
    if(pa||va) data.imgId=await agUpload(pa||va,"image");
    var ref=S.db.collection("dishes").doc();
    await netRetry(function(){ return ref.set(data); });
    return {ok:true, dish_id:ref.id, label:"Qo'shildi: "+data.name+" — "+agMoney(price)};
  }
  if(c.name==="update_dish"){
    var d=agDish(a.dish_id); if(!d) return {ok:false,error:"taom topilmadi"};
    var patch={updatedAt:new Date().toISOString()};
    AG_FIELDS.forEach(function(k){ if(a[k]!==undefined&&a[k]!==null) patch[k]=String(a[k]).trim(); });
    AG_NUMS.forEach(function(k){ if(a[k]!==undefined&&a[k]!==null) patch[k]=Math.max(0,Math.round(Number(a[k])||0)); });
    if(["kcal","prot","fat","carb"].some(function(k){ return patch[k]!==undefined; })) patch.kcalEst=true;
    if(a.cat){ var nc=agCatId(a.cat); if(!nc) return {ok:false,error:"kategoriya topilmadi", label:d.name}; if(nc!==d.cat){ patch.cat=nc; patch.order=dishesOf(nc).reduce(function(mx,x){ return Math.max(mx,x.order||0); },0)+10; } }
    var oldImg=d.imgId, oldVid=d.videoId;
    var pa2=agAtt(a.photo), va2=agAtt(a.video);
    if(va2&&va2.kind!=="video"){ pa2=pa2||va2; va2=null; }
    if(va2) patch.videoId=await agUpload(va2,"video");
    if(pa2) patch.imgId=await agUpload(pa2,"image"); else if(va2&&!d.imgId) patch.imgId=await agUpload(va2,"image");
    if(a.remove_photo) patch.imgId=""; if(a.remove_video) patch.videoId="";
    await netRetry(function(){ return S.db.doc("dishes/"+d.id).update(patch); });
    if(patch.imgId!==undefined&&oldImg&&oldImg!==patch.imgId) S.assets.delete(oldImg).catch(function(){});
    if(patch.videoId!==undefined&&oldVid&&oldVid!==patch.videoId) S.assets.delete(oldVid).catch(function(){});
    return {ok:true, label:"O'zgartirildi: "+(patch.name||d.name)+(patch.price?" — "+agMoney(patch.price):"")};
  }
  if(c.name==="delete_dish"){
    var d2=agDish(a.dish_id); if(!d2) return {ok:false,error:"taom topilmadi"};
    await netRetry(function(){ return S.db.doc("dishes/"+d2.id).delete(); });
    if(d2.imgId) S.assets.delete(d2.imgId).catch(function(){}); if(d2.videoId) S.assets.delete(d2.videoId).catch(function(){});
    return {ok:true, label:"O'chirildi: "+d2.name};
  }
  if(c.name==="add_category"){
    var lab=String(a.label||"").trim(); if(!lab) return {ok:false,error:"nom yo'q"};
    var cs=cats(); var nid=slug(lab); while(cs.some(function(x){ return x.id===nid; })) nid+="-2";
    cs.push({id:nid,label:lab,label_ru:String(a.label_ru||"").trim(),label_en:String(a.label_en||"").trim()});
    await netRetry(function(){ return saveSettings({cats:cs}); });
    return {ok:true, cat_id:nid, label:"Kategoriya qo'shildi: "+lab};
  }
  if(c.name==="rename_category"){
    var cs2=cats(), cc=cs2.find(function(x){ return x.id===a.cat_id; }); if(!cc) return {ok:false,error:"kategoriya topilmadi"};
    if(a.label) cc.label=String(a.label).trim(); if(a.label_ru!==undefined) cc.label_ru=String(a.label_ru).trim(); if(a.label_en!==undefined) cc.label_en=String(a.label_en).trim();
    await netRetry(function(){ return saveSettings({cats:cs2}); });
    return {ok:true, label:"Kategoriya: "+cc.label};
  }
  if(c.name==="update_settings"){
    var p={}; if(a.name!==undefined) p.name=String(a.name).trim(); if(a.service!==undefined) p.service=Math.max(0,Math.min(50,Number(a.service)||0));
    ["soundOn","callsOn","zonePick"].forEach(function(k){ if(a[k]!==undefined) p[k]=!!a[k]; }); if(a.theme!==undefined&&THEMES[a.theme]) p.theme=a.theme;
    if(!Object.keys(p).length) return {ok:false,error:"o'zgarish yo'q"};
    await netRetry(function(){ return saveSettings(p); });
    return {ok:true, label:"Sozlamalar saqlandi"};
  }
  if(c.name==="set_review_hidden"){
    var r=await S.sb.from("uno_reviews").update({hidden:!!a.hidden}).eq("id",a.review_id); if(r.error) return {ok:false,error:r.error.message};
    try{ rvLoadSum(); if(typeof Rev!=="undefined"&&Rev.el){ Rev.rows=null; Rev.load(); } }catch(_){}
    return {ok:true, label:"Izoh #"+a.review_id+(a.hidden?" yashirildi":" ko'rsatildi")};
  }
  return {ok:false,error:"noma'lum amal"};
}

async function init(){
  applyStatic(); fit(); route(); buildSlides();
  var note=$("statusNote");
  var timer=setTimeout(function(){ if(!S.loadedDishes){ note.textContent="Menyu hali yuklanmadi. Internet aloqasini tekshiring."; if(S.view==="admin") renderAdmin(); } },10000);
  window.addEventListener("uno-db-error",function(e){ S.dbError=String(e.detail||""); if(!S.dishes||!S.dishes.length) note.textContent="Bazaga ulanib bo'lmadi: "+S.dbError; if(S.view==="admin") renderAdmin(); });
  window.addEventListener("uno-db-ok",function(){ if(S.dbError){ S.dbError=""; note.textContent=""; } });
  await loadSupabase(navigator.onLine===false?1500:6000);
  var be=null; try{ if(window.supabase) be=makeBackend(); }catch(e){ console.error(e); }
  /* started offline: reload once the internet is back so live updates and admin work again */
  if(!be) window.addEventListener("online",function(){ setTimeout(function(){ location.reload(); },1500); });
  if(be){ S.sb=be.sb; S.db=be.db; S.assets=be.assets; S.canEdit=true; } else { setTimeout(rvLoadSum,500); }
  refreshCallUI();
  S.sample=null; S.cred={login:""}; S.credLoaded=true;
  if(be) S.sample=makeGemini();
  if(S.sb){
    try{ var gs=await S.sb.auth.getSession(); S.sbSession=gs.data&&gs.data.session||null; }catch(_){}
    S.sb.auth.onAuthStateChange(function(ev,ses){ S.sbSession=ses||null; if(ev==="SIGNED_OUT"&&S.view==="admin") renderAdmin(); });
  }
  if(!S.db){
    var cc=null; try{ cc=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(_){}
    clearTimeout(timer);
    if(cc){ var sm=cc["settings/main"]||{}; S.settings={name:sm.name||"",logoId:String(sm.logoId||""),soundOn:sm.soundOn!==false,service:sm.service,cats:Array.isArray(sm.cats)?sm.cats:[],zones:Array.isArray(sm.zones)?sm.zones:[],zonePick:!!sm.zonePick,callsOn:!!sm.callsOn,theme:sm.theme||"classic",delivery:sm.delivery||{},aiNotes:aiNotesOf(sm)}; applyTheme();
      S.dishes=Object.keys(cc).filter(function(k){return k.indexOf("dishes/")===0;}).map(function(k){ var d=cc[k]||{}; var o={id:k.slice(7),name:String(d.name||""),desc:String(d.desc||""),price:Number(d.price)||0,cat:String(d.cat||""),order:Number(d.order)||0,imgId:String(d.imgId||""),videoId:String(d.videoId||""),weight:String(d.weight||""),time:Number(d.time)||0,kcal:Number(d.kcal)||0,prot:Number(d.prot)||0,fat:Number(d.fat)||0,carb:Number(d.carb)||0,kcalEst:!!d.kcalEst}; ["ingr","name_ru","desc_ru","ingr_ru","name_en","desc_en","ingr_en"].forEach(function(x){ o[x]=String(d[x]||""); }); return o; });
      S.loadedSettings=true; }
    else note.textContent="Menyu ma'lumotlarini olib bo'lmadi. Internetni tekshiring.";
    S.loadedDishes=true; onData(); if(!cc) setTimeout(function(){ location.reload(); },30000); return;
  }
  S.db.doc("settings/main").onSnapshot(function(snap){
    var d=snap.exists?snap.data():{}; S.settings={name:(d&&d.name)||"", logoId:String((d&&d.logoId)||""), soundOn:!(d&&d.soundOn===false), service:d&&d.service, cats:Array.isArray(d&&d.cats)?d.cats.filter(function(c){return c&&c.id&&c.label;}):[], zones:Array.isArray(d&&d.zones)?d.zones:[], zonePick:!!(d&&d.zonePick), callsOn:!!(d&&d.callsOn), theme:(d&&d.theme)||"classic", delivery:(d&&d.delivery)||{}, aiNotes:aiNotesOf(d)};
    applyTheme(); S.loadedSettings=true; onData(); try{ refreshCallUI(); }catch(_){}
  });
  S.db.collection("dishes").onSnapshot(function(snap){
    S.dishes=snap.docs.map(function(doc){ var d=doc.data()||{}; var o={id:doc.id,name:String(d.name||""),desc:String(d.desc||""),price:Number(d.price)||0,cat:String(d.cat||""),order:Number(d.order)||0,imgId:String(d.imgId||""),videoId:String(d.videoId||""),weight:String(d.weight||""),time:Number(d.time)||0,kcal:Number(d.kcal)||0,prot:Number(d.prot)||0,fat:Number(d.fat)||0,carb:Number(d.carb)||0,kcalEst:!!d.kcalEst};
      ["ingr","name_ru","desc_ru","ingr_ru","name_en","desc_en","ingr_en"].forEach(function(k){ o[k]=String(d[k]||""); }); return o; });
    if(!snap.metadata.fromCache){ S.loadedDishes=true; clearTimeout(timer); note.textContent=""; }

  },function(err){ clearTimeout(timer); S.loadedDishes=true; note.textContent="Menyuni olib bo'lmadi."; onData(); });
  rvLoadSum(); setInterval(rvLoadSum, 5*60*1000);

}

init();
})();
