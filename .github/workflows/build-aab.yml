name: Play Market uchun AAB (UNO Airways)
# Google Play faqat .aab qabul qiladi. Actions → "Play Market uchun AAB" → Run workflow
# Natija: Releases → aab (UNO-Airways.aab) — Play Console'ga shu yuklanadi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build AAB
        shell: bash
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VERSION: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SB_URL: https://eaxavnixuqgwashplnhz.supabase.co
          SB_KEY: sb_publishable_gILXDU_L8vepyEbsF87Tcg_hYyMpril
        run: |
          set -e
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          B="$ANDROID_HOME/build-tools/35.0.0"; J="$ANDROID_HOME/platforms/android-35/android.jar"
          SITE_URL=$(echo "$SITE_URL" | tr 'A-Z' 'a-z')
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > build.jks
          # Play versionCode must grow: 1000 + run number keeps it above the sideloaded APK numbers
          VC=$((1000 + VERSION))
          W=work; rm -rf $W; mkdir -p $W/classes $W/dex $W/base/manifest $W/base/dex
          cp -r android/res $W/res; cp -r android/menu/src $W/src
          sed -e "s#__VERSION__#${VC}#g" -e "s#android:versionName=\"1.${VC}\"#android:versionName=\"1.3.${VERSION}\"#" android/menu/AndroidManifest.xml > $W/AndroidManifest.xml
          find $W/src -name '*.java' -exec sed -i -e "s#__SITE_URL__#${SITE_URL}#g" -e "s#__SB_URL__#${SB_URL}#g" -e "s#__SB_KEY__#${SB_KEY}#g" {} +
          javac -source 8 -target 8 -nowarn -classpath "$J" -d $W/classes $(find $W/src -name '*.java')
          "$B/d8" --lib "$J" --min-api 23 --output $W/dex $(find $W/classes -name '*.class')
          "$B/aapt2" compile --dir $W/res -o $W/res.zip
          "$B/aapt2" link --proto-format -I "$J" --manifest $W/AndroidManifest.xml -o $W/linked.zip $W/res.zip --auto-add-overlay
          (cd $W && unzip -q linked.zip -d base_tmp && mv base_tmp/AndroidManifest.xml base/manifest/ && cp -r base_tmp/* base/ && cp dex/classes.dex base/dex/ && cd base && zip -qr ../base.zip .)
          java -jar bundletool.jar build-bundle --modules=$W/base.zip --output=UNO-Airways-unsigned.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore build.jks -storepass android -keypass android -signedjar UNO-Airways.aab UNO-Airways-unsigned.aab "$(keytool -list -keystore build.jks -storepass android | awk -F, '/PrivateKeyEntry/{print $1; exit}')"
          jarsigner -verify UNO-Airways.aab | tail -1
          java -jar bundletool.jar validate --bundle=UNO-Airways.aab | head -5
          ls -la UNO-Airways.aab
          echo "versionCode=$VC"
      - uses: actions/upload-artifact@v4
        with:
          name: UNO-AAB
          path: UNO-Airways.aab
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete aab --yes --cleanup-tag || true
          gh release create aab UNO-Airways.aab --title "UNO Airways — Play Market AAB (#${{ github.run_number }})" --notes "Google Play Console → Ilova → Release'ga shu faylni yuklang." --target "${{ github.sha }}" --prerelease
