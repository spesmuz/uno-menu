name: APK yig'ish (UNO Airways Menu)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build APK
        shell: bash
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VERSION: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          B="$ANDROID_HOME/build-tools/35.0.0"
          J="$ANDROID_HOME/platforms/android-35/android.jar"
          SITE_URL=$(echo "$SITE_URL" | tr 'A-Z' 'a-z')
          echo "Menyu manzili: $SITE_URL"

          mkdir -p src/uz/uno/airways classes dex
          cp -r android/res res

          cat > AndroidManifest.xml <<MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="uz.uno.airways" android:versionCode="${VERSION}" android:versionName="1.${VERSION}">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="32"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="UNO Airways" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" android:hardwareAccelerated="true" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="fullSensor" android:launchMode="singleTask" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > src/uz/uno/airways/MainActivity.java <<'JAVA'
          package uz.uno.airways;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
            static final String URL = "__SITE_URL__";
            static final int PICK = 7;
            WebView web;
            ValueCallback<Uri[]> fileCb;
            final Handler h = new Handler();
            boolean failed = false;

            void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              immersive();
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#0A0908"));
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setTextZoom(100);
              s.setSupportZoom(false);
              web.setOverScrollMode(View.OVER_SCROLL_NEVER);

              web.setWebViewClient(new WebViewClient() {
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) { failed = true; showOffline(); }
                }
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  return !(u.startsWith(URL) || u.startsWith("about:"));
                }
              });

              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  ArrayList<String> types = new ArrayList<String>();
                  for (String a : p.getAcceptTypes()) for (String t : a.split(",")) { t = t.trim(); if (t.contains("/")) types.add(t); }
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(types.size() == 1 ? types.get(0) : "*/*");
                  if (types.size() > 1) i.putExtra(Intent.EXTRA_MIME_TYPES, types.toArray(new String[0]));
                  try { startActivityForResult(Intent.createChooser(i, "Fayl tanlang"), PICK); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
                @Override public void onPermissionRequest(PermissionRequest r) { r.deny(); }
              });

              web.loadUrl(URL);
            }

            void showOffline() {
              web.loadDataWithBaseURL(null,
                "<html><body style='margin:0;background:#0A0908;color:#E8B04B;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
                "<div><div style='font-size:26px;margin-bottom:12px'>UNO Airways Restaurante</div>" +
                "<div style='color:#bbb;font-size:17px'>Internetga ulanish kutilmoqda…<br>Подключение к интернету…</div></div></body></html>",
                "text/html", "utf-8", null);
              h.postDelayed(new Runnable() { public void run() { if (failed) { failed = false; web.loadUrl(URL); } } }, 8000);
            }

            @Override protected void onActivityResult(int rq, int rc, Intent data) {
              if (rq == PICK && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rc, data));
                fileCb = null;
              } else super.onActivityResult(rq, rc, data);
            }

            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
            @Override protected void onResume() { super.onResume(); web.onResume(); immersive(); }
            @Override protected void onPause() { web.onPause(); super.onPause(); }

            @Override public void onBackPressed() {
              if (web.canGoBack()) web.goBack();
              else web.evaluateJavascript("window.unoBack&&window.unoBack()", null);
            }
          }
          JAVA
          sed -i "s#__SITE_URL__#${SITE_URL}#" src/uz/uno/airways/MainActivity.java

          javac -source 8 -target 8 -nowarn -classpath "$J" -d classes src/uz/uno/airways/MainActivity.java
          "$B/d8" --lib "$J" --min-api 23 --output dex $(find classes -name '*.class')
          "$B/aapt2" compile --dir res -o resources.zip
          "$B/aapt2" link -I "$J" --manifest AndroidManifest.xml -o unsigned.apk resources.zip
          zip -j unsigned.apk dex/classes.dex
          "$B/zipalign" -f 4 unsigned.apk aligned.apk

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build.jks
          else
            keytool -genkeypair -keystore build.jks -storepass android -keypass android -alias uno -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=UNO Airways' 2>/dev/null
          fi
          "$B/apksigner" sign --ks build.jks --ks-pass pass:android --key-pass pass:android --out UNO-Airways.apk aligned.apk
          "$B/apksigner" verify UNO-Airways.apk
          ls -la UNO-Airways.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UNO-Airways-APK
          path: UNO-Airways.apk
