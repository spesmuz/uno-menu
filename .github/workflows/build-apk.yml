name: APK yig'ish (UNO Airways Menu + Ofitsiant)
# APK: Actions → "APK yig'ish" → Run workflow
# Natija: Releases → apk (UNO-Airways.apk, UNO-Ofitsiant.apk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build APKs
        shell: bash
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VERSION: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SB_URL: https://eaxavnixuqgwashplnhz.supabase.co
          SB_KEY: sb_publishable_gILXDU_L8vepyEbsF87Tcg_hYyMpril
        run: |
          set -e
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          B="$ANDROID_HOME/build-tools/35.0.0"
          J="$ANDROID_HOME/platforms/android-35/android.jar"
          SITE_URL=$(echo "$SITE_URL" | tr 'A-Z' 'a-z')
          echo "Sayt: $SITE_URL"

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret qo'shilmagan. Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > build.jks

          # build_apk <dir in android/> <output apk>
          build_apk() {
            local NAME="$1" OUT="$2" W="work-$1"
            rm -rf "$W"; mkdir -p "$W/classes" "$W/dex"
            cp -r android/res "$W/res"
            cp -r "android/$NAME/src" "$W/src"
            sed -e "s#__VERSION__#${VERSION}#g" "android/$NAME/AndroidManifest.xml" > "$W/AndroidManifest.xml"
            find "$W/src" -name '*.java' -exec sed -i -e "s#__SITE_URL__#${SITE_URL}#g" -e "s#__SB_URL__#${SB_URL}#g" -e "s#__SB_KEY__#${SB_KEY}#g" {} +
            javac -source 8 -target 8 -nowarn -classpath "$J" -d "$W/classes" $(find "$W/src" -name '*.java')
            "$B/d8" --lib "$J" --min-api 23 --output "$W/dex" $(find "$W/classes" -name '*.class')
            "$B/aapt2" compile --dir "$W/res" -o "$W/resources.zip"
            "$B/aapt2" link -I "$J" --manifest "$W/AndroidManifest.xml" -o "$W/unsigned.apk" "$W/resources.zip"
            (cd "$W" && zip -j unsigned.apk dex/classes.dex)
            "$B/zipalign" -f 4 "$W/unsigned.apk" "$W/aligned.apk"
            "$B/apksigner" sign --ks build.jks --ks-pass pass:android --key-pass pass:android --out "$OUT" "$W/aligned.apk"
            "$B/apksigner" verify "$OUT"
            ls -la "$OUT"
          }

          build_apk menu UNO-Airways.apk
          build_apk waiter UNO-Ofitsiant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UNO-APK
          path: |
            UNO-Airways.apk
            UNO-Ofitsiant.apk

      - name: To'g'ridan-to'g'ri yuklab olish havolasi (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk UNO-Airways.apk UNO-Ofitsiant.apk \
            --title "UNO Airways APK (#${{ github.run_number }})" \
            --notes "Menyu (planshetlar) va Ofitsiant (telefonlar) ilovalari." \
            --target "${{ github.sha }}" --latest
