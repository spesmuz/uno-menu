name: App Store (listing + review)
# appstore/ papkasi o'zgarsa yoki qo'lda ishga tushirilsa: skrinshot oladi, App Store sahifasini to'ldiradi
# va ilovani Apple tekshiruviga topshiradi (App Store Connect API kaliti orqali). Natija: appstore-ci branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'appstore/**'
      - '.github/workflows/appstore.yml'

permissions:
  contents: write

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  submit:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: uz.uno.airways
    steps:
      - uses: actions/checkout@v4

      - name: Xcode + project
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -project UNOAirways.xcodeproj -scheme UNOAirways -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Screenshots (iPhone 6.9")
        timeout-minutes: 20
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/UNOAirways.app)
          DEV=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]; best=None
          for rt,l in d.items():
            if "iOS" not in rt: continue
            for x in l:
              n=x["name"]
              if "Pro Max" in n:
                k=(rt, n)
                if best is None or k>best[0]: best=(k,x["udid"],n)
          print(best[1]); print(best[2], file=sys.stderr)')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          shoot() { # locale lang tab file wait
            xcrun simctl terminate "$DEV" uz.uno.airways || true
            xcrun simctl launch "$DEV" uz.uno.airways -tab $3 -AppleLanguages "($2)" -AppleLocale $2
            sleep $5
            mkdir -p appstore/shots/$1
            xcrun simctl io "$DEV" screenshot /tmp/raw.png
            sips --resampleWidth 1290 /tmp/raw.png --out /tmp/w.png >/dev/null
            sips --cropToHeightWidth 2796 1290 /tmp/w.png --out "appstore/shots/$1/$4.png" >/dev/null
            sips -g pixelWidth -g pixelHeight "appstore/shots/$1/$4.png" | tail -2 | tr '\n' ' '; echo
          }
          # first launch: let the menu download its photos
          xcrun simctl launch "$DEV" uz.uno.airways -tab 0; sleep 40
          for L in "en-US en" "ru ru"; do
            set -- $L
            shoot $1 $2 0 1 25
            shoot $1 $2 1 2 8
            shoot $1 $2 3 3 12
            shoot $1 $2 2 4 8
          done
          ls -la appstore/shots/*

      - name: Fill the listing and submit
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          python3 appstore/submit.py
          while read -r l; do case "$l" in FAIL*) echo "::error title=appstore::$l";; *) echo "::notice title=appstore::$l";; esac; done < out/appstore.log

      - name: Publish results to branch appstore-ci
        if: always()
        run: |
          mkdir -p pub && cp -r out pub/ 2>/dev/null; cp -r appstore/shots pub/ 2>/dev/null; cd pub
          echo "run ${{ github.run_number }} ${{ job.status }} $(date -u)" > status.txt
          git init -q -b appstore-ci
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "App Store run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" appstore-ci 2>&1 | tail -n 3; true
