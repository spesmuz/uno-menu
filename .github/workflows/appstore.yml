name: App Store (listing + review)
# appstore/ papkasi o'zgarsa yoki qo'lda ishga tushirilsa: jonli menyudan skrinshot oladi, App Store sahifasini
# to'ldiradi va ilovani Apple tekshiruviga topshiradi (App Store Connect API kaliti orqali). Natija: appstore-ci branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'appstore/**'
      - '.github/workflows/appstore.yml'

permissions:
  contents: write

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: uz.uno.airways
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          pip install --quiet playwright pyjwt cryptography requests
          python -m playwright install --with-deps chromium >/dev/null
      - name: Screenshots (iPhone 6.9", 1290x2796)
        continue-on-error: true
        run: python appstore/shots.py
      - name: Fill the listing and submit
        if: always()
        run: |
          python appstore/submit.py
          echo "::notice title=appstore::$(sed ':a;N;$!ba;s/\n/%0A/g' out/appstore.log)"
          cat out/appstore.log >> $GITHUB_STEP_SUMMARY
      - name: Publish results to branch appstore-ci
        if: always()
        run: |
          mkdir -p pub; cp -r out pub/ 2>/dev/null || true; cp -r appstore/shots pub/ 2>/dev/null || true; cd pub
          echo "run ${{ github.run_number }} ${{ job.status }} $(date -u)" > status.txt
          git init -q -b appstore-ci
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "App Store run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" appstore-ci 2>&1 | tail -n 3 || true
