name: iOS ilova (App Store)
# TestFlight release enabled 2026-11-22
# Har safar ios/ o'zgarsa: yig'adi, simulyatorda skrinshot oladi (ios-ci branch).
# App Store Connect kaliti (secrets) qo'shilgan bo'lsa — imzolab App Store Connect'ga (TestFlight) yuklaydi.
# Kerakli secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (AuthKey .p8 fayl matni), APPLE_TEAM_ID

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version | tee -a $GITHUB_STEP_SUMMARY
          mkdir -p out
          xcodebuild -version > out/xcode.txt

      - name: Project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (simulator)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project UNOAirways.xcodeproj -scheme UNOAirways -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../out/build-full.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" | tee ../out/build.log

      - name: Screenshots
        run: |
          set -x
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/UNOAirways.app)
          DEV=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]; best=None
          for rt,l in d.items():
            if "iOS" not in rt: continue
            for x in l:
              n=x["name"]
              if "Pro Max" in n or "Plus" in n:
                k=(("Pro Max" in n), rt, n)
                if best is None or k>best[0]: best=(k,x["udid"],n)
          print(best[1]); print(best[2], file=sys.stderr)')
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEV" "$APP"
          mkdir -p out/screens
          for T in 0 1 2; do
            xcrun simctl terminate "$DEV" uz.uno.airways || true
            xcrun simctl launch "$DEV" uz.uno.airways -tab $T -AppleLanguages "(uz)" -AppleLocale uz_UZ
            if [ $T = 0 ]; then sleep 25; else sleep 6; fi
            xcrun simctl io "$DEV" screenshot "out/screens/uz-$T.png"
          done
          xcrun simctl launch "$DEV" uz.uno.airways -tab 0 || true
          sleep 2; xcrun simctl io "$DEV" screenshot "out/screens/uz-0b.png"
          for T in 1 2; do
            xcrun simctl terminate "$DEV" uz.uno.airways || true
            xcrun simctl launch "$DEV" uz.uno.airways -tab $T -AppleLanguages "(ru)" -AppleLocale ru_RU
            sleep 6; xcrun simctl io "$DEV" screenshot "out/screens/ru-$T.png"
          done

      - name: Demo video
        continue-on-error: true
        run: |
          xcrun simctl terminate "$DEV" uz.uno.airways || true
          cd ios
          xcodebuild build-for-testing -project UNOAirways.xcodeproj -scheme UNOAirways -destination "id=$DEV" \
            -derivedDataPath ../build 2>&1 | tail -3
          xcrun simctl io "$DEV" recordVideo --codec h264 --force ../out/demo.mp4 &
          REC=$!
          sleep 2
          xcodebuild test-without-building -project UNOAirways.xcodeproj -scheme UNOAirways -destination "id=$DEV" \
            -derivedDataPath ../build -only-testing:UNOAirwaysUITests/DemoTests/testDemo 2>&1 | tee ../out/test-full.log | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" | tee ../out/test.log
          cd ..
          kill -INT $REC; wait $REC || true
          ls -la out/demo.mp4

      - name: Release to App Store Connect (TestFlight)
        if: ${{ env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios
          xcodebuild -project UNOAirways.xcodeproj -scheme UNOAirways -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../build/UNO.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $AUTH archive 2>&1 | tee ../out/archive-full.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" | tee ../out/archive.log
          cat > ../build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath ../build/UNO.xcarchive -exportOptionsPlist ../build/export.plist \
            -exportPath ../build/export $AUTH 2>&1 | tee ../out/upload-full.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload" | tee ../out/upload.log
          rm -f "$KEY"

      - name: Publish results to branch ios-ci
        if: always()
        run: |
          cd out
          rm -f *-full.log.tmp
          for f in *-full.log; do [ -f "$f" ] && tail -n 300 "$f" > "${f%.log}-tail.log" && rm "$f"; done
          echo "run ${{ github.run_number }} ${{ job.status }} $(date -u)" > status.txt
          git init -q -b ios-ci
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "iOS CI run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-ci
