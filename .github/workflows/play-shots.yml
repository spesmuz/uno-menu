name: Google Play screenshots
# play/shots.py o'zgarsa yoki qo'lda ishga tushirilsa: jonli saytdan Android ko'rinishida 1080x1920 skrinshot oladi
# va play/shots/ ga yozadi (https://spesmuz.github.io/uno-menu/play/ sahifasida ko'rinadi).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['play/shots.py', '.github/workflows/play-shots.yml']
permissions:
  contents: write
concurrency: { group: play-shots, cancel-in-progress: true }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
      - run: python play/shots.py uz ru
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add play/shots
          git diff --cached --quiet && exit 0
          git commit -m "Google Play screenshots"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
